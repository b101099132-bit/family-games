<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<title>全家翻翻樂</title>
<style>
:root{
  --bg:#FFF6E9; --bg2:#FFE9CC; --ink:#3B2A1A; --muted:#8A7258;
  --panel:#FFFFFF; --line:#F0DCC0;
  --back1:#FF8A5B; --back2:#FFB65C; --accent:#FF7A45;
  --p0:#FF5E6C; --p1:#3D8BFF; --p2:#2FB36D; --p3:#B266FF;
  --radius:18px;
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;}
body{background:
  radial-gradient(circle at 12% 18%, #FFE2B8 0 120px, transparent 121px),
  radial-gradient(circle at 88% 82%, #FFD9C7 0 160px, transparent 161px),
  var(--bg);}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;}
.screen{position:fixed;inset:0;display:none;}
.screen.on{display:flex;}

/* ---------- 開始畫面 ---------- */
#home{flex-direction:column;align-items:center;overflow:auto;padding:max(16px,2.5vh) 16px 24px;}
.title{font-size:clamp(34px,6vh,64px);font-weight:900;letter-spacing:.06em;margin:.2em 0 .1em;
  color:var(--accent);text-shadow:0 4px 0 #FFD2B0;}
.title span{display:inline-block;animation:bob 2.4s ease-in-out infinite;}
.title span:nth-child(2n){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.subtitle{color:var(--muted);font-size:clamp(15px,2.2vh,20px);margin-bottom:max(12px,2vh);}
.demo-note{background:#FFF0C2;border:2px dashed #F5C85A;border-radius:12px;padding:6px 14px;
  font-size:15px;color:#7A5A00;margin-bottom:12px;}
.home-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;width:min(1100px,100%);}
@media (orientation:portrait), (max-width:820px){.home-grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border-radius:24px;padding:20px 22px;box-shadow:0 6px 0 var(--line);}
.panel h2{margin:0 0 14px;font-size:22px;display:flex;align-items:center;gap:8px;}
.seg{display:flex;gap:10px;flex-wrap:wrap;}
.seg button{min-width:64px;height:56px;padding:0 18px;border-radius:16px;background:#FFF3E2;
  font-size:22px;font-weight:800;box-shadow:0 4px 0 var(--line);transition:transform .1s;}
.seg button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line);}
.seg button.sel{background:var(--accent);color:#fff;box-shadow:0 4px 0 #D9572A;}
.players{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
.prow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:18px;background:#FFF9F1;
  border:3px solid var(--pc);}
.avatar{width:62px;height:62px;border-radius:50%;background:var(--pc);font-size:38px;display:grid;
  place-items:center;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.12);}
.prow input{flex:1;min-width:0;height:52px;border-radius:14px;border:2px solid var(--line);
  font:inherit;font-size:24px;font-weight:700;padding:0 14px;color:var(--ink);background:#fff;}
.prow .hint{font-size:13px;color:var(--muted);flex:none;}
.setting{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
.setting label{font-size:18px;font-weight:800;}
.setting small{color:var(--muted);font-weight:500;font-size:14px;}
.startbar{display:flex;gap:14px;justify-content:center;margin-top:22px;flex-wrap:wrap;}
.bigbtn{height:78px;padding:0 54px;border-radius:40px;background:var(--accent);color:#fff;
  font-size:34px;font-weight:900;letter-spacing:.1em;box-shadow:0 7px 0 #D9572A;}
.bigbtn:active{transform:translateY(5px);box-shadow:0 2px 0 #D9572A;}
.ghost{height:78px;padding:0 26px;border-radius:40px;background:#fff;font-size:22px;font-weight:800;
  box-shadow:0 7px 0 var(--line);}

/* ---------- 密碼畫面 ---------- */
#lock{flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;}
#lock .lockbox{background:#fff;border-radius:30px;padding:32px 36px;box-shadow:0 8px 0 var(--line);width:min(480px,100%);
  display:flex;flex-direction:column;gap:16px;align-items:center;}
#lock .big{font-size:64px;}
#lock input{width:100%;height:64px;border-radius:18px;border:3px solid var(--line);font:inherit;font-size:28px;
  text-align:center;font-weight:800;color:var(--ink);-webkit-user-select:text;user-select:text;}
#lock input:focus{outline:none;border-color:var(--accent);}
#lock .err{color:#D93A3A;font-weight:800;min-height:1.4em;font-size:18px;}
#lock label{font-size:17px;color:var(--muted);display:flex;align-items:center;gap:8px;}
#lock label input{width:24px;height:24px;}
#lock .lockbox.bad{animation:shakeX .4s;}
@keyframes shakeX{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}

/* ---------- 遊戲畫面 ---------- */
#game{flex-direction:column;}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 14px 4px;flex:none;}
.scores{flex:1;display:flex;gap:12px;justify-content:center;align-items:stretch;}
.chip{display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:999px;
  background:#fff;border:4px solid transparent;box-shadow:0 4px 0 var(--line);
  transition:transform .25s, box-shadow .25s, opacity .25s;position:relative;opacity:.6;min-width:0;}
.chip .av{width:clamp(40px,6vh,64px);height:clamp(40px,6vh,64px);border-radius:50%;background:var(--pc);
  display:grid;place-items:center;font-size:clamp(24px,3.8vh,40px);flex:none;}
.chip .nm{font-size:clamp(16px,2.4vh,26px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22vw;}
.chip .sc{font-size:clamp(26px,4.4vh,46px);font-weight:900;color:var(--pc);min-width:1.2em;text-align:center;}
.chip.cur{opacity:1;border-color:var(--pc);transform:scale(1.08);
  box-shadow:0 0 0 6px color-mix(in srgb,var(--pc) 22%,transparent),0 6px 0 var(--line);}
.chip.cur::after{content:"輪到你！";position:absolute;left:50%;top:100%;transform:translate(-50%,4px);
  background:var(--pc);color:#fff;font-size:clamp(12px,1.7vh,16px);font-weight:800;padding:2px 10px;border-radius:999px;
  white-space:nowrap;animation:pulse 1s ease-in-out infinite;}
.solo .chip{opacity:1}
.solo .chip.cur::after{display:none}
@keyframes pulse{50%{transform:translate(-50%,7px)}}
.chip.pop .sc{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.7)}}
.tools{display:flex;gap:8px;align-items:center;flex:none;}
.timer{font-size:clamp(20px,3vh,32px);font-weight:900;font-variant-numeric:tabular-nums;background:#fff;
  padding:6px 14px;border-radius:14px;box-shadow:0 4px 0 var(--line);}
.icon{width:clamp(44px,6vh,60px);height:clamp(44px,6vh,60px);border-radius:16px;background:#fff;
  font-size:clamp(22px,3.2vh,30px);box-shadow:0 4px 0 var(--line);}
.icon:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line);}
#board-wrap{flex:1;min-height:0;padding:30px 14px 14px;display:flex;align-items:center;justify-content:center;}
#board{display:grid;justify-content:center;align-content:center;}
.card{perspective:900px;cursor:pointer;position:relative;}
.inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,1.4,.5,1);
  transform-style:preserve-3d;}
.card.up .inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;border-radius:var(--cr);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;}
.back{background:
  radial-gradient(circle at 30% 30%, rgba(255,255,255,.35) 0 14%, transparent 15%),
  radial-gradient(circle at 72% 70%, rgba(255,255,255,.25) 0 10%, transparent 11%),
  linear-gradient(135deg,var(--back1),var(--back2));
  box-shadow:inset 0 0 0 calc(var(--cs)*.045) rgba(255,255,255,.75), 0 calc(var(--cs)*.04) 0 #D9783F;
  display:grid;place-items:center;}
.back::after{content:"?";font-size:calc(var(--cs)*.42);font-weight:900;color:rgba(255,255,255,.9);
  text-shadow:0 3px 0 rgba(0,0,0,.12);}
.front{transform:rotateY(180deg);background:#fff;box-shadow:0 calc(var(--cs)*.04) 0 var(--line);}
.front img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block;pointer-events:none;}
.card.matched .front{box-shadow:inset 0 0 0 calc(var(--cs)*.06) var(--owner), 0 calc(var(--cs)*.04) 0 var(--line);}
.card.matched .front img{opacity:.93}
.badge{position:absolute;right:4%;bottom:4%;width:26%;height:26%;border-radius:50%;background:var(--owner);
  display:none;place-items:center;font-size:calc(var(--cs)*.18);box-shadow:0 2px 6px rgba(0,0,0,.25);
  transform:rotateY(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.card.matched .badge{display:grid;}
.card.shake .inner{animation:shake .45s;}
@keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(-6%)}75%{transform:rotateY(180deg) translateX(6%)}}
.card.got .inner{animation:got .6s;}
@keyframes got{50%{transform:rotateY(180deg) scale(1.12)}}

/* ---------- 覆蓋層 ---------- */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50;}
.overlay.on{display:flex;}
#peek{pointer-events:none;align-items:flex-start;padding-top:6px;}
#peek .bubble{background:rgba(59,42,26,.88);color:#fff;border-radius:999px;padding:6px 30px;display:flex;align-items:center;gap:18px;
  box-shadow:0 6px 0 rgba(0,0,0,.15);}
#peek .n{font-size:clamp(44px,8vh,80px);font-weight:900;line-height:1;min-width:1.2em;text-align:center;}
#peek .t{font-size:clamp(22px,3.4vh,34px);font-weight:800;}
#banner{pointer-events:none;}
#banner .b{background:var(--pc);color:#fff;padding:22px 56px;border-radius:999px;font-size:clamp(34px,7vh,72px);
  font-weight:900;box-shadow:0 10px 0 rgba(0,0,0,.18);animation:zoomIn .35s cubic-bezier(.3,1.6,.5,1);
  display:flex;align-items:center;gap:20px;}
@keyframes zoomIn{from{transform:scale(.3);opacity:0}}
#show{background:rgba(40,25,10,.55);}
#show .frame{background:#fff;padding:14px 14px 18px;border-radius:26px;border:8px solid var(--pc);
  animation:zoomIn .4s cubic-bezier(.3,1.5,.5,1);display:flex;flex-direction:column;align-items:center;gap:10px;
  max-width:88vw;}
#show img{max-width:80vw;max-height:66vh;border-radius:14px;display:block;}
#show .cap{font-size:clamp(26px,5vh,48px);font-weight:900;color:var(--pc);}
.modal{background:rgba(40,25,10,.5);}
.modal .box{background:#fff;border-radius:30px;padding:30px 36px;min-width:min(520px,90vw);text-align:center;
  box-shadow:0 10px 0 var(--line);animation:zoomIn .3s;}
.modal h2{font-size:clamp(30px,5vh,46px);margin:0 0 18px;}
.modal .col{display:flex;flex-direction:column;gap:14px;align-items:center;}
.modal .bigbtn,.modal .ghost{width:min(380px,80vw);}
.rank{display:flex;flex-direction:column;gap:12px;margin:6px 0 24px;}
.rrow{display:flex;align-items:center;gap:16px;padding:10px 20px;border-radius:20px;background:#FFF9F1;border:4px solid var(--pc);}
.rrow .md{font-size:44px;width:56px}
.rrow .av{width:60px;height:60px;border-radius:50%;background:var(--pc);display:grid;place-items:center;font-size:36px}
.rrow .nm{flex:1;text-align:left;font-size:30px;font-weight:900}
.rrow .sc{font-size:40px;font-weight:900;color:var(--pc)}
.rrow.first{transform:scale(1.04);background:#FFF3C4}
.meta{font-size:22px;color:var(--muted);font-weight:700;margin-bottom:18px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;}
</style>
</head>
<body>

<!-- 開始畫面 -->
<section id="lock" class="screen">
  <div class="title"><span>全</span><span>家</span><span>翻</span><span>翻</span><span>樂</span></div>
  <form class="lockbox" id="lockForm" autocomplete="off">
    <div class="big">🔒</div>
    <div style="font-size:22px;font-weight:800">請輸入家庭密碼</div>
    <input id="pw" type="password" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label><input type="checkbox" id="remember" checked>記住這台裝置，下次不用再輸入</label>
    <div class="err" id="pwErr"></div>
    <button class="bigbtn" id="unlockBtn" type="submit">打開</button>
  </form>
</section>

<section id="home" class="screen">
  <div class="title"><span>全</span><span>家</span><span>翻</span><span>翻</span><span>樂</span></div>
  <div class="subtitle">翻開兩張一樣的照片就得分，配到了還可以再翻一次！</div>
  <div class="demo-note" id="demoNote" hidden>目前是示範圖片，放入家人照片後就會換成照片版</div>
  <div class="home-grid">
    <div class="panel">
      <h2>👨‍👩‍👧 幾個人玩？</h2>
      <div class="seg" id="segPlayers"></div>
      <div class="players" id="playerRows"></div>
    </div>
    <div class="panel">
      <div class="setting">
        <label>🃏 幾組牌 <small id="photoCount"></small></label>
        <div class="seg" id="segPairs"></div>
      </div>
      <div class="setting">
        <label>👀 偷看時間 <small>開始前先全部翻開</small></label>
        <div class="seg" id="segPeek"></div>
      </div>
      <div class="setting">
        <label>⏱️ 計時器</label>
        <div class="seg" id="segTimer"></div>
      </div>
      <div class="setting">
        <label>🔊 音效</label>
        <div class="seg" id="segSound"></div>
      </div>
      <div class="setting" style="margin-bottom:0">
        <label>🔍 配對成功時放大照片</label>
        <div class="seg" id="segShow"></div>
      </div>
    </div>
  </div>
  <div class="startbar">
    <button class="ghost" onclick="location.href='../'">🏠 遊戲選單</button>
    <button class="ghost" id="fsBtn">⛶ 全螢幕</button>
    <button class="bigbtn" id="startBtn">開始玩！</button>
  </div>
</section>

<!-- 遊戲畫面 -->
<section id="game" class="screen">
  <div class="topbar">
    <div class="scores" id="scores"></div>
    <div class="tools">
      <div class="timer" id="timer" hidden>0:00</div>
      <button class="icon" id="muteBtn" aria-label="音效">🔊</button>
      <button class="icon" id="pauseBtn" aria-label="暫停">⏸️</button>
    </div>
  </div>
  <div id="board-wrap"><div id="board"></div></div>
</section>

<div class="overlay" id="peek"><div class="bubble"><div class="n" id="peekN">10</div><div class="t">快記住位置！</div></div></div>
<div class="overlay" id="banner"><div class="b" id="bannerBox"></div></div>
<div class="overlay" id="show"><div class="frame" id="showFrame"><img id="showImg" alt=""><div class="cap" id="showCap"></div></div></div>
<div class="overlay modal" id="pauseModal"><div class="box">
  <h2>暫停一下</h2>
  <div class="col">
    <button class="bigbtn" id="resumeBtn">繼續玩</button>
    <button class="ghost" id="restartBtn">🔄 重新開始</button>
    <button class="ghost" id="homeBtn">🏠 回首頁</button>
  </div>
</div></div>
<div class="overlay modal" id="endModal"><div class="box">
  <h2 id="endTitle">🎉 全部找到了！</h2>
  <div class="rank" id="rank"></div>
  <div class="meta" id="endMeta"></div>
  <div class="col">
    <button class="bigbtn" id="againBtn">再玩一次</button>
    <button class="ghost" id="endHomeBtn">🏠 回首頁</button>
  </div>
</div></div>
<canvas id="confetti"></canvas>

<script>
/* 照片資料：由打包工具填入 */
let PHOTOS = {"src": "../photos.json?v=5dc631653a"};

/* ---------- 設定 ---------- */
const COLORS = ['var(--p0)','var(--p1)','var(--p2)','var(--p3)'];
const ANIMALS = ['🐰','🐻','🐱','🐶','🐼','🦊','🐯','🐸','🐧','🦁','🐵','🐨','🐷','🐮','🦄','🐥'];
const DEFAULT_NAMES = ['玩家1','玩家2','玩家3','玩家4'];
const MISS_DELAY = 1600;   // 沒配到時，牌停留的時間（毫秒）
let settings = {
  count: 2,
  players: [0,1,2,3].map(i => ({name: DEFAULT_NAMES[i], emoji: ANIMALS[i]})),
  pairs: 15, peek: 10, timer: true, sound: true, show: true
};
try { const s = JSON.parse(localStorage.getItem('flipgame-settings') || 'null'); if (s) settings = Object.assign(settings, s); } catch(e) {}
function saveSettings(){ try { localStorage.setItem('flipgame-settings', JSON.stringify(settings)); } catch(e) {} }

const $ = id => document.getElementById(id);

/* ---------- 示範圖片（沒有照片時使用） ---------- */
let photos = [], thumbs = [];
function makeThumb(src, size){
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const m = Math.min(im.width, im.height), c = document.createElement('canvas'); c.width = c.height = size;
      c.getContext('2d').drawImage(im, (im.width - m) / 2, Math.max(0, (im.height - m) * .3), m, m, 0, 0, size, size);
      res(c.toDataURL('image/jpeg', .85));
    };
    im.onerror = () => res(src); im.src = src;
  });
}
function useDemoIfEmpty(){
if (!photos.length) {
  $('demoNote').hidden = false;
  const em = ['🍎','🚗','🌈','🎈','🐳','🍦','🚀','🌻','🎂','🦄','🍉','🚂','⚽','🎸','🌙','🍩','🐢','🏰','🎁','🍓','🦋','🚁','🌵','🍕','🐙','⛵','🎨','🍌','🦖','⭐'];
  photos = em.map((e, i) => {
    const c = document.createElement('canvas'); c.width = c.height = 320;
    const g = c.getContext('2d');
    g.fillStyle = `hsl(${(i * 47) % 360} 85% 82%)`; g.fillRect(0, 0, 320, 320);
    g.font = '200px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(e, 160, 172);
    return c.toDataURL('image/png');
  });
}
}

/* ---------- 音效（不需要音檔） ---------- */
let actx = null;
function audio(){ if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (actx && actx.state === 'suspended') actx.resume(); return actx; }
function tone(freq, dur, {type='sine', vol=.18, at=0, slide=0} = {}){
  if (!settings.sound) return; const a = audio(); if (!a) return;
  const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
const SFX = {
  flip(){ tone(520, .09, {type:'triangle', slide:880, vol:.15}); },
  match(){ [523,659,784,1047].forEach((f,i) => tone(f, .22, {type:'triangle', at:i*.09, vol:.2})); },
  miss(){ tone(330, .18, {type:'sine', vol:.14}); tone(247, .3, {type:'sine', at:.16, vol:.14}); },
  turn(){ tone(660, .1, {vol:.12}); tone(880, .14, {at:.1, vol:.12}); },
  tick(){ tone(990, .06, {type:'square', vol:.05}); },
  go(){ tone(784, .12, {type:'triangle'}); tone(1175, .25, {type:'triangle', at:.12}); },
  win(){ [523,523,523,659,587,659,784,1047].forEach((f,i) => tone(f, .26, {type:'triangle', at:[0,.15,.3,.45,.75,.9,1.05,1.3][i], vol:.2})); }
};

/* ---------- 開始畫面 ---------- */
function seg(el, options, current, onPick){
  el.innerHTML = '';
  options.forEach(([val, label]) => {
    const b = document.createElement('button'); b.textContent = label;
    if (val === current) b.classList.add('sel');
    b.onclick = () => { audio(); SFX.flip(); onPick(val); };
    el.appendChild(b);
  });
}
function pairOptions(){
  const n = photos.length;
  const list = [6,10,15,20,24,30,36,40].filter(x => x <= n);
  if (n >= 2 && !list.includes(n) && n <= 48) list.push(n);
  return list;
}
function renderHome(){
  seg($('segPlayers'), [[1,'1 人'],[2,'2 人'],[3,'3 人'],[4,'4 人']], settings.count, v => { settings.count = v; saveSettings(); renderHome(); });
  const rows = $('playerRows'); rows.innerHTML = '';
  for (let i = 0; i < settings.count; i++) {
    const p = settings.players[i];
    const r = document.createElement('div'); r.className = 'prow'; r.style.setProperty('--pc', COLORS[i]);
    r.innerHTML = `<button class="avatar">${p.emoji}</button><input maxlength="6" value="${p.name.replace(/"/g,'&quot;')}"><span class="hint">點動物可以換</span>`;
    r.querySelector('.avatar').onclick = e => {
      audio(); SFX.flip();
      const used = settings.players.slice(0, settings.count).map(x => x.emoji);
      let k = ANIMALS.indexOf(p.emoji);
      do { k = (k + 1) % ANIMALS.length; } while (used.includes(ANIMALS[k]) && ANIMALS[k] !== p.emoji);
      p.emoji = ANIMALS[k]; e.currentTarget.textContent = p.emoji; saveSettings();
    };
    r.querySelector('input').oninput = e => { p.name = e.target.value; saveSettings(); };
    rows.appendChild(r);
  }
  const po = pairOptions();
  if (!po.includes(settings.pairs)) settings.pairs = po.includes(15) ? 15 : po[po.length - 1];
  $('photoCount').textContent = `（共有 ${photos.length} 張照片）`;
  seg($('segPairs'), po.map(x => [x, x === photos.length && ![6,10,15,20,24,30,36,40].includes(x) ? `全部 ${x}` : String(x)]), settings.pairs, v => { settings.pairs = v; saveSettings(); renderHome(); });
  seg($('segPeek'), [[0,'不偷看'],[3,'3 秒'],[5,'5 秒'],[10,'10 秒']], settings.peek, v => { settings.peek = v; saveSettings(); renderHome(); });
  seg($('segTimer'), [[true,'開'],[false,'關']], settings.timer, v => { settings.timer = v; saveSettings(); renderHome(); });
  seg($('segSound'), [[true,'開'],[false,'關']], settings.sound, v => { settings.sound = v; saveSettings(); renderHome(); });
  seg($('segShow'), [[true,'開'],[false,'關']], settings.show, v => { settings.show = v; saveSettings(); renderHome(); });
}

/* 全螢幕 */
const fsEl = document.documentElement;
const canFS = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
function toggleFS(){
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl);
  } catch(e) {}
}
if (!canFS) $('fsBtn').hidden = true;
$('fsBtn').onclick = toggleFS;

/* 螢幕不要自動變暗 */
let wakeLock = null;
async function keepAwake(){ try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && $('game').classList.contains('on')) keepAwake(); });

/* ---------- 遊戲 ---------- */
let G = null;
const alive = t => !!G && t === G.token;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }

function startGame(){
  audio();
  const players = settings.players.slice(0, settings.count).map((p, i) => ({
    name: (p.name || '').trim() || DEFAULT_NAMES[i], emoji: p.emoji, color: COLORS[i], score: 0, tries: 0
  }));
  const chosen = shuffle(photos.map((_, i) => i)).slice(0, settings.pairs);
  const deck = shuffle(chosen.flatMap(k => [k, k])).map(k => ({k, up:false, matched:false, owner:-1}));
  G = { players, deck, cur: 0, first: -1, lock: true, found: 0, elapsed: 0, timerOn: false, paused: false, token: {} };
  $('game').classList.toggle('solo', players.length === 1);
  renderScores(); buildBoard(); show('game'); fitBoard(); keepAwake();
  $('timer').hidden = !settings.timer; $('timer').textContent = '0:00';
  $('muteBtn').textContent = settings.sound ? '🔊' : '🔇';
  runIntro(G.token);
}

async function runIntro(token){
  if (settings.peek > 0) {
    await sleep(400); if (!alive(token)) return;
    G.deck.forEach((c, i) => setTimeout(() => { if (alive(token)) cardEl(i).classList.add('up'); }, i * 18));
    await sleep(G.deck.length * 18 + 300);
    $('peek').classList.add('on');
    for (let s = settings.peek; s > 0; s--) {
      if (!alive(token)) return;
      $('peekN').textContent = s; if (s <= 3) SFX.tick();
      await waitUnpaused(1000, token);
    }
    $('peek').classList.remove('on');
    if (!alive(token)) return;
    G.deck.forEach((c, i) => cardEl(i).classList.remove('up'));
    SFX.go(); await sleep(600);
  }
  if (!alive(token)) return;
  await turnBanner(token);
  if (!alive(token)) return;
  G.lock = false; G.timerOn = true; G.lastTick = performance.now();
}
async function waitUnpaused(ms, token){
  let left = ms;
  while (left > 0) { await sleep(100); if (!alive(token)) return; if (!G.paused) left -= 100; }
}

function buildBoard(){
  const b = $('board'); b.innerHTML = '';
  G.deck.forEach((c, i) => {
    const d = document.createElement('div'); d.className = 'card'; d.dataset.i = i;
    d.innerHTML = `<div class="inner"><div class="face back"></div><div class="face front"><img src="${thumbs[c.k]}" alt=""></div><div class="badge"></div></div>`;
    d.addEventListener('pointerdown', () => onCard(i));
    b.appendChild(d);
  });
}
const cardEl = i => $('board').children[i];

function fitBoard(){
  if (!G) return;
  const wrap = $('board-wrap'), b = $('board');
  const cs = getComputedStyle(wrap);
  const W = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const H = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const N = G.deck.length;
  let best = {s:0, c:1};
  for (let c = 1; c <= N; c++) {
    const r = Math.ceil(N / c);
    const gap = Math.max(6, Math.min(16, Math.min(W / c, H / r) * .07));
    const s = Math.min((W - gap * (c - 1)) / c, (H - gap * (r - 1)) / r);
    if (s > best.s) best = {s, c, gap};
  }
  const s = Math.floor(best.s);
  b.style.gridTemplateColumns = `repeat(${best.c}, ${s}px)`;
  b.style.gridAutoRows = `${s}px`;
  b.style.gap = `${best.gap}px`;
  b.style.setProperty('--cs', s + 'px');
  b.style.setProperty('--cr', Math.max(8, s * .12) + 'px');
}
window.addEventListener('resize', fitBoard);

function renderScores(){
  const box = $('scores'); box.innerHTML = '';
  G.players.forEach((p, i) => {
    const c = document.createElement('div'); c.className = 'chip' + (i === G.cur ? ' cur' : '');
    c.style.setProperty('--pc', p.color);
    c.innerHTML = `<div class="av">${p.emoji}</div><div class="nm"></div><div class="sc">${p.score}</div>`;
    c.querySelector('.nm').textContent = p.name;
    box.appendChild(c);
  });
}
function bumpScore(i){
  const c = $('scores').children[i]; c.querySelector('.sc').textContent = G.players[i].score;
  c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
}

async function turnBanner(token){
  if (G.players.length === 1) return;
  const p = G.players[G.cur];
  $('bannerBox').style.setProperty('--pc', p.color);
  $('banner').style.setProperty('--pc', p.color);
  $('bannerBox').innerHTML = `<span>${p.emoji}</span><span></span>`;
  $('bannerBox').lastChild.textContent = `輪到 ${p.name}`;
  $('banner').classList.add('on'); SFX.turn();
  await sleep(1000);
  if (alive(token)) $('banner').classList.remove('on');
}

async function onCard(i){
  if (!G || G.lock || G.paused) return;
  const c = G.deck[i];
  if (c.up || c.matched) return;
  c.up = true; cardEl(i).classList.add('up'); SFX.flip();
  if (G.first < 0) { G.first = i; return; }
  const a = G.first, token = G.token; G.first = -1; G.lock = true;
  const p = G.players[G.cur]; p.tries++;
  await sleep(550); if (!alive(token)) return;
  if (G.deck[a].k === c.k) {
    // 配對成功
    p.score++; G.found++;
    [a, i].forEach(x => {
      const d = G.deck[x]; d.matched = true; d.owner = G.cur;
      const el = cardEl(x); el.classList.add('matched', 'got'); el.style.setProperty('--owner', p.color);
      el.querySelector('.badge').textContent = p.emoji;
    });
    SFX.match(); bumpScore(G.cur);
    if (settings.show) await showcase(c.k, p, token);
    if (!alive(token)) return;
    if (G.found === G.deck.length / 2) return endGame();
    G.lock = false;   // 配到了，同一位玩家再翻一次
  } else {
    // 沒配到
    SFX.miss();
    [a, i].forEach(x => { const el = cardEl(x); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); });
    await waitUnpaused(MISS_DELAY, token); if (!alive(token)) return;
    [a, i].forEach(x => { G.deck[x].up = false; cardEl(x).classList.remove('up', 'shake'); });
    await sleep(350); if (!alive(token)) return;
    if (G.players.length > 1) {
      G.cur = (G.cur + 1) % G.players.length; renderScores();
      await turnBanner(token); if (!alive(token)) return;
    }
    G.lock = false;
  }
}

function showcase(k, p, token){
  return new Promise(res => {
    const ov = $('show');
    $('showFrame').style.setProperty('--pc', p.color);
    $('showImg').src = photos[k];
    $('showCap').textContent = G.players.length > 1 ? `${p.emoji} ${p.name} +1 ⭐` : '答對了！⭐';
    ov.classList.add('on');
    let done = false;
    const finish = () => { if (done) return; done = true; ov.classList.remove('on'); ov.onpointerdown = null; setTimeout(res, 150); };
    ov.onpointerdown = finish;
    setTimeout(finish, 1800);
  });
}

/* 計時器 */
function fmt(ms){ const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
setInterval(() => {
  if (!G || !G.timerOn) return;
  const now = performance.now();
  if (!G.paused) G.elapsed += now - G.lastTick;
  G.lastTick = now;
  if (settings.timer) $('timer').textContent = fmt(G.elapsed);
}, 250);

/* 暫停 */
$('pauseBtn').onclick = () => { if (!G) return; G.paused = true; $('pauseModal').classList.add('on'); };
$('resumeBtn').onclick = () => { G.paused = false; G.lastTick = performance.now(); $('pauseModal').classList.remove('on'); };
$('restartBtn').onclick = () => { $('pauseModal').classList.remove('on'); clearOverlays(); startGame(); };
$('homeBtn').onclick = () => { $('pauseModal').classList.remove('on'); goHome(); };
$('muteBtn').onclick = () => { settings.sound = !settings.sound; saveSettings(); $('muteBtn').textContent = settings.sound ? '🔊' : '🔇'; if (settings.sound) SFX.flip(); };
function clearOverlays(){ ['peek','banner','show'].forEach(id => $(id).classList.remove('on')); }
function goHome(){ if (G) G.token = {}; G = null; clearOverlays(); stopConfetti(); try { wakeLock && wakeLock.release(); } catch(e) {} renderHome(); show('home'); }

/* 結束 */
async function endGame(){
  G.timerOn = false; G.lock = true; const token = G.token;
  await sleep(700); if (!alive(token)) return;
  const ps = G.players.map((p, i) => ({...p, i}));
  const sorted = [...ps].sort((a, b) => b.score - a.score);
  let html = '';
  if (ps.length === 1) {
    $('endTitle').textContent = '🎉 全部找到了！';
    const p = ps[0];
    html = `<div class="rrow first" style="--pc:${p.color}"><div class="md">🏆</div><div class="av">${p.emoji}</div><div class="nm"></div><div class="sc">${p.score} 組</div></div>`;
    $('endMeta').textContent = `翻了 ${p.tries} 次` + (settings.timer ? `，用了 ${fmt(G.elapsed)}` : '');
  } else {
    const top = sorted[0].score, winners = sorted.filter(p => p.score === top);
    $('endTitle').textContent = winners.length > 1 ? '🎉 平手！大家都好棒！' : `🎉 ${winners[0].name} 贏了！`;
    const medals = ['🥇','🥈','🥉','🎖️'];
    let rank = 0;
    sorted.forEach((p, idx) => {
      if (idx > 0 && p.score < sorted[idx - 1].score) rank = idx;
      html += `<div class="rrow${rank === 0 ? ' first' : ''}" style="--pc:${p.color}"><div class="md">${medals[rank]}</div><div class="av">${p.emoji}</div><div class="nm" data-i="${p.i}"></div><div class="sc">${p.score}</div></div>`;
    });
    $('endMeta').textContent = settings.timer ? `總共用了 ${fmt(G.elapsed)}` : '';
  }
  $('rank').innerHTML = html;
  $('rank').querySelectorAll('.nm').forEach((el, idx) => { el.textContent = ps.length === 1 ? ps[0].name : sorted[idx].name; });
  $('endModal').classList.add('on'); SFX.win(); confetti();
}
$('againBtn').onclick = () => { $('endModal').classList.remove('on'); stopConfetti(); startGame(); };
$('endHomeBtn').onclick = () => { $('endModal').classList.remove('on'); goHome(); };

/* 彩帶 */
let confRAF = 0;
function confetti(){
  const cv = $('confetti'), g = cv.getContext('2d');
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; g.scale(devicePixelRatio, devicePixelRatio);
  const cols = ['#FF5E6C','#3D8BFF','#2FB36D','#B266FF','#FFC93C','#FF8A5B'];
  const parts = Array.from({length: 180}, () => ({x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .6,
    vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3, r: Math.random() * 6, w: 8 + Math.random() * 8, h: 5 + Math.random() * 6,
    c: cols[Math.floor(Math.random() * cols.length)], s: (Math.random() - .5) * .3}));
  const t0 = performance.now();
  const step = t => {
    g.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.s; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.w/2, -p.h/2, p.w, p.h); g.restore(); });
    if (t - t0 < 5000) confRAF = requestAnimationFrame(step); else g.clearRect(0, 0, innerWidth, innerHeight);
  };
  confRAF = requestAnimationFrame(step);
}
function stopConfetti(){ cancelAnimationFrame(confRAF); const cv = $('confetti'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); }

$('startBtn').onclick = startGame;

/* ---------- 解密照片（GitHub 版用密碼鎖住） ---------- */
const b64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
async function decryptPhotos(pw){ const d = await decryptRaw(pw); return Array.isArray(d) ? d : d.items.map(it => it[0]); }
async function decryptRaw(pw){
  const e = PHOTOS.enc;
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(e.salt), iterations:e.iter, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(e.iv)}, key, b64(e.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function enterHome(){ useDemoIfEmpty(); thumbs = await Promise.all(photos.map(p => makeThumb(p, 320))); renderHome(); show('home'); }
/* 共用照片檔：所有遊戲讀同一份（iPad 只下載一次） */
async function loadShared(){
  if (!PHOTOS || !PHOTOS.src) return;
  const ld = document.createElement('div'); ld.id = 'loadingPhotos';
  ld.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;font:800 28px system-ui,sans-serif;color:#888;z-index:9999;background:inherit';
  ld.textContent = '📷 照片載入中…'; document.body.appendChild(ld);
  try { PHOTOS = await (await fetch(PHOTOS.src)).json(); } catch(e) { ld.textContent = '照片載入失敗，請檢查網路後重新整理'; throw e; }
  ld.remove();
}
async function boot(){
  await loadShared();
  if (Array.isArray(PHOTOS)) { photos = PHOTOS; return enterHome(); }
  let saved = null; try { saved = localStorage.getItem('flipgame-pw'); } catch(e) {}
  if (saved) { try { photos = await decryptPhotos(saved); return enterHome(); } catch(e) {} }
  show('lock'); setTimeout(() => $('pw').focus(), 300);
}
$('lockForm').onsubmit = async ev => {
  ev.preventDefault();
  const pw = $('pw').value; if (!pw) return;
  $('unlockBtn').disabled = true; $('pwErr').textContent = '';
  try {
    photos = await decryptPhotos(pw);
    try { if ($('remember').checked) localStorage.setItem('flipgame-pw', pw); else localStorage.removeItem('flipgame-pw'); } catch(e) {}
    $('pw').blur(); await enterHome();
  } catch(e) {
    $('pwErr').textContent = window.crypto && crypto.subtle ? '密碼不對喔，再試一次' : '這個瀏覽器不支援解鎖，請用 Safari 或 Chrome 打開';
    const box = $('lockForm'); box.classList.remove('bad'); void box.offsetWidth; box.classList.add('bad');
  }
  $('unlockBtn').disabled = false;
};
boot();
</script>
