<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<title>全家消消樂</title>
<style>
:root{
  --bg:#EEF8F3; --ink:#24372F; --muted:#6B8579; --line:#CFE6DA; --panel:#fff;
  --accent:#22A57E; --accent-d:#17805F;
  --p0:#FF5E6C; --p1:#3D8BFF; --p2:#F2A100; --p3:#B266FF;
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
body{background:
  radial-gradient(circle at 10% 15%, #D9F2E6 0 130px, transparent 131px),
  radial-gradient(circle at 90% 85%, #FFF0C9 0 170px, transparent 171px), var(--bg);}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;}
.screen{position:fixed;inset:0;display:none;}
.screen.on{display:flex;}
.title{font-size:clamp(34px,6vh,64px);font-weight:900;letter-spacing:.06em;margin:.2em 0 .1em;color:var(--accent);text-shadow:0 4px 0 #BFE8D6;}
.title span{display:inline-block;animation:bob 2.4s ease-in-out infinite;}
.title span:nth-child(2n){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-6px) rotate(3deg)}}
.panel{background:var(--panel);border-radius:24px;padding:20px 22px;box-shadow:0 6px 0 var(--line);}
.panel h2{margin:0 0 14px;font-size:22px;}
.seg{display:flex;gap:10px;flex-wrap:wrap;}
.seg button{min-width:64px;height:56px;padding:0 18px;border-radius:16px;background:#EDF7F2;font-size:22px;font-weight:800;box-shadow:0 4px 0 var(--line);}
.seg button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line);}
.seg button.sel{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-d);}
.bigbtn{height:78px;padding:0 54px;border-radius:40px;background:var(--accent);color:#fff;font-size:34px;font-weight:900;letter-spacing:.1em;box-shadow:0 7px 0 var(--accent-d);}
.bigbtn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--accent-d);}
.ghost{height:78px;padding:0 26px;border-radius:40px;background:#fff;font-size:22px;font-weight:800;box-shadow:0 7px 0 var(--line);}

/* 密碼 */
#lock{flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;}
.lockbox{background:#fff;border-radius:30px;padding:32px 36px;box-shadow:0 8px 0 var(--line);width:min(480px,100%);display:flex;flex-direction:column;gap:16px;align-items:center;}
.lockbox .big{font-size:64px;}
#pw{width:100%;height:64px;border-radius:18px;border:3px solid var(--line);font:inherit;font-size:28px;text-align:center;font-weight:800;color:var(--ink);-webkit-user-select:text;user-select:text;}
#pw:focus{outline:none;border-color:var(--accent);}
.lockbox .err{color:#D93A3A;font-weight:800;min-height:1.4em;font-size:18px;}
.lockbox label{font-size:17px;color:var(--muted);display:flex;align-items:center;gap:8px;}
.lockbox label input{width:24px;height:24px;}
.lockbox.bad{animation:shakeX .4s;}
@keyframes shakeX{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}

/* 首頁 */
#home{flex-direction:column;align-items:center;overflow:auto;padding:max(16px,2.5vh) 16px 24px;}
.subtitle{color:var(--muted);font-size:clamp(15px,2.2vh,20px);margin-bottom:max(12px,2vh);text-align:center;}
.home-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;width:min(1100px,100%);}
@media (orientation:portrait),(max-width:820px){.home-grid{grid-template-columns:1fr}}
.players{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
.prow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:18px;background:#F6FBF8;border:3px solid var(--pc);}
.avatar{width:62px;height:62px;border-radius:50%;background:var(--pc);font-size:38px;display:grid;place-items:center;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.12);}
.prow input{flex:1;min-width:0;height:52px;border-radius:14px;border:2px solid var(--line);font:inherit;font-size:24px;font-weight:700;padding:0 14px;color:var(--ink);background:#fff;}
.prow .hint{font-size:13px;color:var(--muted);flex:none;}
.setting{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
.setting label{font-size:18px;font-weight:800;}
.setting small{color:var(--muted);font-weight:500;font-size:14px;}
.setting.off{display:none;}
.modeNote{margin-top:14px;padding:12px 14px;border-radius:14px;background:#FFF7DE;color:#7A5A00;font-size:16px;font-weight:700;line-height:1.5;}
.startbar{display:flex;gap:14px;justify-content:center;margin-top:22px;flex-wrap:wrap;}

/* 遊戲 */
#game{flex-direction:column;}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 14px 6px;flex:none;}
.scores{flex:1;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.chip{display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:999px;background:#fff;border:4px solid transparent;
  box-shadow:0 4px 0 var(--line);opacity:.55;transition:transform .25s,opacity .25s;}
.chip .av{width:clamp(40px,6vh,60px);height:clamp(40px,6vh,60px);border-radius:50%;background:var(--pc);display:grid;place-items:center;font-size:clamp(24px,3.6vh,38px);}
.chip .nm{font-size:clamp(16px,2.4vh,24px);font-weight:800;white-space:nowrap;max-width:18vw;overflow:hidden;text-overflow:ellipsis;}
.chip .sc{font-size:clamp(26px,4.2vh,44px);font-weight:900;color:var(--pc);min-width:1.2em;text-align:center;}
.chip.cur{opacity:1;border-color:var(--pc);transform:scale(1.08);box-shadow:0 0 0 6px color-mix(in srgb,var(--pc) 22%,transparent),0 6px 0 var(--line);}
.chip.pop .sc{animation:pop .45s;}
@keyframes pop{40%{transform:scale(1.7)}}
.status{display:flex;align-items:center;gap:10px;flex:none;}
.clock{font-size:clamp(24px,4vh,42px);font-weight:900;font-variant-numeric:tabular-nums;background:#fff;padding:4px 18px;border-radius:16px;box-shadow:0 4px 0 var(--line);min-width:3.6em;text-align:center;}
.clock.hurry{color:#fff;background:#FF5E6C;animation:hurry .5s infinite alternate;}
@keyframes hurry{to{transform:scale(1.08)}}
.left{font-size:clamp(14px,2vh,20px);font-weight:800;color:var(--muted);background:#fff;padding:6px 12px;border-radius:12px;box-shadow:0 4px 0 var(--line);}
.icon{width:clamp(44px,6vh,60px);height:clamp(44px,6vh,60px);border-radius:16px;background:#fff;font-size:clamp(22px,3.2vh,30px);box-shadow:0 4px 0 var(--line);}
.bar{height:10px;margin:0 16px;border-radius:999px;background:#DCEFE5;overflow:hidden;flex:none;}
.bar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transition:background .3s;}
#board-wrap{flex:1;min-height:0;padding:12px 14px 14px;display:flex;align-items:center;justify-content:center;}
#board{display:grid;justify-content:center;align-content:center;}
.tile{position:relative;border-radius:var(--tr);cursor:pointer;transition:transform .15s;}
.tile img{width:100%;height:100%;object-fit:cover;object-position:center 30%;border-radius:var(--tr);display:block;pointer-events:none;
  box-shadow:0 calc(var(--ts)*.04) 0 rgba(0,0,0,.12);background:#fff;}
.tile::after{content:"";position:absolute;inset:0;border-radius:var(--tr);box-shadow:inset 0 0 0 calc(var(--ts)*.03) rgba(255,255,255,.9);pointer-events:none;}
.tile.sel{transform:translateY(-6%) scale(1.06);z-index:2;}
.tile.sel::after{box-shadow:inset 0 0 0 calc(var(--ts)*.07) var(--pc), 0 0 0 calc(var(--ts)*.05) color-mix(in srgb,var(--pc) 35%,transparent);}
.tile.wrong{animation:wrong .4s;}
@keyframes wrong{25%{transform:translateX(-8%) rotate(-4deg)}75%{transform:translateX(8%) rotate(4deg)}}
.tile.gone{animation:gone .45s forwards;pointer-events:none;}
@keyframes gone{40%{transform:scale(1.25);opacity:1}100%{transform:scale(0);opacity:0}}
.tile.dead{visibility:hidden;pointer-events:none;}
.tile.hint img{animation:hintGlow .8s ease-in-out 3;}
@keyframes hintGlow{50%{filter:brightness(1.25);transform:scale(1.08)}}
.plus{position:fixed;font-size:44px;font-weight:900;color:var(--pc);pointer-events:none;z-index:40;text-shadow:0 3px 0 #fff;animation:plus .9s forwards;}
@keyframes plus{to{transform:translateY(-80px);opacity:0}}

/* 覆蓋層 */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50;}
.overlay.on{display:flex;}
.modal{background:rgba(30,50,40,.5);}
.box{background:#fff;border-radius:30px;padding:30px 36px;min-width:min(520px,90vw);max-width:92vw;text-align:center;box-shadow:0 10px 0 var(--line);animation:zoomIn .3s cubic-bezier(.3,1.5,.5,1);}
@keyframes zoomIn{from{transform:scale(.3);opacity:0}}
.box h2{font-size:clamp(30px,5vh,46px);margin:0 0 18px;}
.col{display:flex;flex-direction:column;gap:14px;align-items:center;}
.col .bigbtn,.col .ghost{width:min(380px,80vw);}
.readyAv{width:130px;height:130px;border-radius:50%;background:var(--pc);display:grid;place-items:center;font-size:84px;margin:0 auto 12px;box-shadow:0 8px 0 rgba(0,0,0,.15);}
.readyNm{font-size:clamp(34px,6vh,56px);font-weight:900;color:var(--pc);margin-bottom:6px;}
.readySub{font-size:20px;color:var(--muted);font-weight:700;margin-bottom:22px;}
#count{pointer-events:none;}
#count .n{font-size:clamp(120px,26vh,240px);font-weight:900;color:#fff;text-shadow:0 8px 0 rgba(0,0,0,.2);animation:zoomIn .4s;}
#count{background:rgba(30,50,40,.35);}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--accent);color:#fff;font-size:clamp(30px,6vh,56px);font-weight:900;
  padding:18px 44px;border-radius:999px;z-index:45;pointer-events:none;box-shadow:0 8px 0 rgba(0,0,0,.15);animation:zoomIn .35s;}
.rank{display:flex;flex-direction:column;gap:12px;margin:6px 0 22px;}
.rrow{display:flex;align-items:center;gap:16px;padding:10px 20px;border-radius:20px;background:#F6FBF8;border:4px solid var(--pc);}
.rrow .md{font-size:44px;width:56px}
.rrow .av{width:60px;height:60px;border-radius:50%;background:var(--pc);display:grid;place-items:center;font-size:36px}
.rrow .nm{flex:1;text-align:left;font-size:30px;font-weight:900}
.rrow .sc{font-size:38px;font-weight:900;color:var(--pc)}
.rrow.first{transform:scale(1.04);background:#FFF6D6}
.meta{font-size:22px;color:var(--muted);font-weight:700;margin-bottom:18px;line-height:1.5}
.record{display:inline-block;background:#FFD43B;color:#5A4300;font-weight:900;padding:4px 14px;border-radius:999px;margin-left:8px;animation:hurry .6s infinite alternate;}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;}
</style>
</head>
<body>

<section id="lock" class="screen">
  <div class="title"><span>全</span><span>家</span><span>消</span><span>消</span><span>樂</span></div>
  <form class="lockbox" id="lockForm" autocomplete="off">
    <div class="big">🔒</div>
    <div style="font-size:22px;font-weight:800">請輸入家庭密碼</div>
    <input id="pw" type="password" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label><input type="checkbox" id="remember" checked>記住這台裝置，下次不用再輸入</label>
    <div class="err" id="pwErr"></div>
    <button class="bigbtn" id="unlockBtn" type="submit">打開</button>
  </form>
</section>

<section id="home" class="screen">
  <div class="title"><span>全</span><span>家</span><span>消</span><span>消</span><span>樂</span></div>
  <div class="subtitle">找出兩張一樣的照片，點一下、再點一下，就消掉了！</div>
  <div class="home-grid">
    <div class="panel">
      <h2>👨‍👩‍👧 幾個人玩？</h2>
      <div class="seg" id="segPlayers"></div>
      <div class="players" id="playerRows"></div>
      <div class="modeNote" id="modeNote"></div>
    </div>
    <div class="panel">
      <div class="setting"><label>🖼️ 幾組照片 <small id="photoCount"></small></label><div class="seg" id="segPairs"></div></div>
      <div class="setting" id="setTime"><label>⏱️ 每人時間</label><div class="seg" id="segTime"></div></div>
      <div class="setting" id="setRounds"><label>🔁 玩幾輪 <small>每人輪流算一輪</small></label><div class="seg" id="segRounds"></div></div>
      <div class="setting"><label>💡 找太久時給提示 <small>15 秒沒消到就閃一下</small></label><div class="seg" id="segHint"></div></div>
      <div class="setting" style="margin-bottom:0"><label>🔊 音效</label><div class="seg" id="segSound"></div></div>
    </div>
  </div>
  <div class="startbar">
    <button class="ghost" id="menuBtn" onclick="location.href='../'">🏠 遊戲選單</button>
    <button class="ghost" id="fsBtn">⛶ 全螢幕</button>
    <button class="bigbtn" id="startBtn">開始玩！</button>
  </div>
</section>

<section id="game" class="screen">
  <div class="topbar">
    <div class="scores" id="scores"></div>
    <div class="status">
      <div class="left" id="left"></div>
      <div class="clock" id="clock">0:00</div>
      <button class="icon" id="muteBtn">🔊</button>
      <button class="icon" id="pauseBtn">⏸️</button>
    </div>
  </div>
  <div class="bar" id="bar"><i id="barFill"></i></div>
  <div id="board-wrap"><div id="board"></div></div>
</section>

<div class="overlay modal" id="ready"><div class="box" id="readyBox">
  <div class="readyAv" id="readyAv"></div>
  <div class="readyNm" id="readyNm"></div>
  <div class="readySub" id="readySub"></div>
  <div class="col"><button class="bigbtn" id="goBtn">準備好了！</button></div>
</div></div>
<div class="overlay" id="count"><div class="n" id="countN">3</div></div>
<div class="overlay modal" id="timeup"><div class="box" id="timeupBox">
  <h2>⏰ 時間到！</h2>
  <div class="readyAv" id="tuAv"></div>
  <div class="meta" id="tuMeta"></div>
  <div class="col"><button class="bigbtn" id="nextBtn">下一位</button></div>
</div></div>
<div class="overlay modal" id="pauseModal"><div class="box">
  <h2>暫停一下</h2>
  <div class="col">
    <button class="bigbtn" id="resumeBtn">繼續玩</button>
    <button class="ghost" id="restartBtn">🔄 重新開始</button>
    <button class="ghost" id="homeBtn">🏠 回首頁</button>
  </div>
</div></div>
<div class="overlay modal" id="endModal"><div class="box">
  <h2 id="endTitle"></h2>
  <div class="rank" id="rank"></div>
  <div class="meta" id="endMeta"></div>
  <div class="col">
    <button class="bigbtn" id="againBtn">再玩一次</button>
    <button class="ghost" id="endHomeBtn">🏠 回首頁</button>
  </div>
</div></div>
<canvas id="confetti"></canvas>

<script>
let PHOTOS = {"src": "../photos.json?v=5dc631653a"};
const $ = id => document.getElementById(id);
const COLORS = ['var(--p0)','var(--p1)','var(--p2)','var(--p3)'];
const ANIMALS = ['🐰','🐻','🐱','🐶','🐼','🦊','🐯','🐸','🐧','🦁','🐵','🐨','🐷','🐮','🦄','🐥'];
const DEFAULT_NAMES = ['玩家1','玩家2','玩家3','玩家4'];
const HINT_AFTER = 15000;

/* 設定（玩家名字和翻翻樂共用） */
let settings = { count: 1, pairs: 30, time: 60, rounds: 1, hint: true, sound: true };
let players = [0,1,2,3].map(i => ({name: DEFAULT_NAMES[i], emoji: ANIMALS[i]}));
try { Object.assign(settings, JSON.parse(localStorage.getItem('matchgame-settings') || '{}')); } catch(e) {}
try { const f = JSON.parse(localStorage.getItem('flipgame-settings') || 'null'); if (f && f.players) players = f.players; } catch(e) {}
function save(){
  try {
    localStorage.setItem('matchgame-settings', JSON.stringify(settings));
    const f = JSON.parse(localStorage.getItem('flipgame-settings') || '{}'); f.players = players;
    localStorage.setItem('flipgame-settings', JSON.stringify(f));
  } catch(e) {}
}
function getRecords(){ try { return JSON.parse(localStorage.getItem('matchgame-records') || '{}'); } catch(e) { return {}; } }
function setRecord(pairs, ms){ const r = getRecords(); r[pairs] = ms; try { localStorage.setItem('matchgame-records', JSON.stringify(r)); } catch(e) {} }

/* 照片：原圖給放大用；縮圖給牌面，省 iPad 記憶體 */
let photos = [], thumbs = [];
function demoPhotos(){
  const em = ['🍎','🚗','🌈','🎈','🐳','🍦','🚀','🌻','🎂','🦄','🍉','🚂','⚽','🎸','🌙','🍩','🐢','🏰','🎁','🍓','🦋','🚁','🌵','🍕','🐙','⛵','🎨','🍌','🦖','⭐','🍇','🚲','🎃','🐞','🍔','🧸','🎺','🌽','🐬','🍒','🚜','🎠','🌋','🍪','🐝','🥕','🛸','🍋','🐠','🎡'];
  return em.map((e, i) => {
    const c = document.createElement('canvas'); c.width = c.height = 240; const g = c.getContext('2d');
    g.fillStyle = `hsl(${(i * 47) % 360} 80% 84%)`; g.fillRect(0, 0, 240, 240);
    g.font = '150px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(e, 120, 130);
    return c.toDataURL('image/png');
  });
}
function makeThumb(src, size){
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const s = Math.min(im.width, im.height), c = document.createElement('canvas');
      c.width = c.height = size; const g = c.getContext('2d');
      const sx = (im.width - s) / 2, sy = Math.max(0, (im.height - s) * .3);
      g.drawImage(im, sx, sy, s, s, 0, 0, size, size);
      res(c.toDataURL('image/jpeg', .85));
    };
    im.onerror = () => res(src);
    im.src = src;
  });
}
async function preparePhotos(list){
  photos = list.length ? list : demoPhotos();
  thumbs = await Promise.all(photos.map(p => makeThumb(p, 220)));
}

/* 音效 */
let actx = null;
function audio(){ if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
function tone(f, d, {type='sine', vol=.18, at=0, slide=0} = {}){
  if (!settings.sound) return; const a = audio(); if (!a) return;
  const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .05);
}
const SFX = {
  pick(){ tone(700, .07, {type:'triangle', vol:.13}); },
  match(){ tone(880, .1, {type:'triangle'}); tone(1320, .18, {type:'triangle', at:.08}); },
  wrong(){ tone(260, .16, {vol:.12, slide:200}); },
  tick(){ tone(1000, .05, {type:'square', vol:.05}); },
  go(){ tone(784, .12, {type:'triangle'}); tone(1175, .25, {type:'triangle', at:.12}); },
  clear(){ [523,659,784,1047,1319].forEach((f,i) => tone(f, .2, {type:'triangle', at:i*.08})); },
  buzz(){ tone(440, .5, {type:'sawtooth', vol:.08}); tone(330, .6, {type:'sawtooth', vol:.08, at:.25}); },
  win(){ [523,523,523,659,587,659,784,1047].forEach((f,i) => tone(f, .26, {type:'triangle', at:[0,.15,.3,.45,.75,.9,1.05,1.3][i], vol:.2})); }
};

/* 首頁 */
function seg(el, opts, cur, pick){
  el.innerHTML = '';
  opts.forEach(([v, l]) => { const b = document.createElement('button'); b.textContent = l; if (v === cur) b.classList.add('sel');
    b.onclick = () => { audio(); SFX.pick(); pick(v); }; el.appendChild(b); });
}
function pairOpts(){ return [10,15,20,30,40,50].filter(x => x <= photos.length).concat(photos.length < 10 ? [photos.length] : []); }
function renderHome(){
  seg($('segPlayers'), [[1,'1 人'],[2,'2 人'],[3,'3 人'],[4,'4 人']], settings.count, v => { settings.count = v; save(); renderHome(); });
  const rows = $('playerRows'); rows.innerHTML = '';
  for (let i = 0; i < settings.count; i++) {
    const p = players[i], r = document.createElement('div'); r.className = 'prow'; r.style.setProperty('--pc', COLORS[i]);
    r.innerHTML = `<button class="avatar">${p.emoji}</button><input maxlength="6"><span class="hint">點動物可以換</span>`;
    r.querySelector('input').value = p.name;
    r.querySelector('.avatar').onclick = e => {
      audio(); SFX.pick(); const used = players.slice(0, settings.count).map(x => x.emoji); let k = ANIMALS.indexOf(p.emoji);
      do { k = (k + 1) % ANIMALS.length; } while (used.includes(ANIMALS[k]) && ANIMALS[k] !== p.emoji);
      p.emoji = ANIMALS[k]; e.currentTarget.textContent = p.emoji; save();
    };
    r.querySelector('input').oninput = e => { p.name = e.target.value; save(); };
    rows.appendChild(r);
  }
  const solo = settings.count === 1;
  const rec = getRecords()[settings.pairs];
  $('modeNote').innerHTML = solo
    ? `🏁 <b>計時挑戰</b>：把 ${settings.pairs} 組全部消完，看要花多久。` + (rec ? `<br>目前最快紀錄：<b>${fmt(rec)}</b>` : '')
    : `⚔️ <b>比賽模式</b>：每人輪流 ${settings.time} 秒，每次都是新的一盤，消最多組的人贏！`;
  $('setTime').classList.toggle('off', solo); $('setRounds').classList.toggle('off', solo);
  const po = pairOpts(); if (!po.includes(settings.pairs)) settings.pairs = po.includes(30) ? 30 : po[po.length - 1];
  $('photoCount').textContent = `（共有 ${photos.length} 張照片）`;
  seg($('segPairs'), po.map(x => [x, `${x}`]), settings.pairs, v => { settings.pairs = v; save(); renderHome(); });
  seg($('segTime'), [[30,'30 秒'],[60,'60 秒'],[90,'90 秒'],[120,'120 秒']], settings.time, v => { settings.time = v; save(); renderHome(); });
  seg($('segRounds'), [[1,'1 輪'],[2,'2 輪'],[3,'3 輪']], settings.rounds, v => { settings.rounds = v; save(); renderHome(); });
  seg($('segHint'), [[true,'開'],[false,'關']], settings.hint, v => { settings.hint = v; save(); renderHome(); });
  seg($('segSound'), [[true,'開'],[false,'關']], settings.sound, v => { settings.sound = v; save(); renderHome(); });
}
const fsEl = document.documentElement;
if (!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen)) $('fsBtn').hidden = true;
$('fsBtn').onclick = () => { try {
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl); } catch(e) {} };
let wakeLock = null;
async function keepAwake(){ try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {} }

/* 遊戲 */
const sleep = ms => new Promise(r => setTimeout(r, ms));
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
function fmt(ms){ const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
let G = null;

function startGame(){
  audio();
  const ps = players.slice(0, settings.count).map((p, i) => ({name: (p.name || '').trim() || DEFAULT_NAMES[i], emoji: p.emoji, color: COLORS[i], score: 0}));
  G = { players: ps, solo: ps.length === 1, cur: 0, round: 1, sel: -1, tiles: [], left: 0, running: false, paused: false,
        elapsed: 0, limit: settings.time * 1000, lastTick: 0, lastMatch: 0, hinted: false, turnScore: 0 };
  show('game'); keepAwake();
  $('bar').style.visibility = G.solo ? 'hidden' : 'visible';
  $('muteBtn').textContent = settings.sound ? '🔊' : '🔇';
  renderScores();
  if (G.solo) { newBoard(); beginTurn(); }
  else { newBoard(); showReady(); }
}

function newBoard(){
  const chosen = shuffle(photos.map((_, i) => i)).slice(0, settings.pairs);
  G.tiles = shuffle(chosen.flatMap(k => [k, k])).map(k => ({k, gone:false}));
  G.left = chosen.length; G.sel = -1;
  const b = $('board'); b.innerHTML = '';
  G.tiles.forEach((t, i) => {
    const d = document.createElement('div'); d.className = 'tile';
    d.innerHTML = `<img src="${thumbs[t.k]}" alt="">`;
    d.addEventListener('pointerdown', ev => onTile(i, ev));
    b.appendChild(d);
  });
  fitBoard(); updateLeft();
}
function fitBoard(){
  if (!G) return;
  const wrap = $('board-wrap'), cs = getComputedStyle(wrap), b = $('board');
  const W = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const H = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const N = G.tiles.length; let best = {s:0, c:1, gap:6};
  for (let c = 1; c <= N; c++) {
    const r = Math.ceil(N / c), gap = Math.max(4, Math.min(12, Math.min(W / c, H / r) * .07));
    const s = Math.min((W - gap * (c - 1)) / c, (H - gap * (r - 1)) / r);
    if (s > best.s) best = {s, c, gap};
  }
  const s = Math.floor(best.s);
  b.style.gridTemplateColumns = `repeat(${best.c}, ${s}px)`; b.style.gridAutoRows = `${s}px`; b.style.gap = `${best.gap}px`;
  b.style.setProperty('--ts', s + 'px'); b.style.setProperty('--tr', Math.max(6, s * .14) + 'px');
}
window.addEventListener('resize', fitBoard);
const tileEl = i => $('board').children[i];
function updateLeft(){ $('left').textContent = `還剩 ${G.left} 組`; }

function renderScores(){
  const box = $('scores'); box.innerHTML = '';
  G.players.forEach((p, i) => {
    const c = document.createElement('div'); c.className = 'chip' + (i === G.cur ? ' cur' : ''); c.style.setProperty('--pc', p.color);
    c.innerHTML = `<div class="av">${p.emoji}</div><div class="nm"></div><div class="sc">${p.score}</div>`;
    c.querySelector('.nm').textContent = p.name; box.appendChild(c);
  });
  $('board').style.setProperty('--pc', G.players[G.cur].color);
}

function showReady(){
  const p = G.players[G.cur];
  $('readyBox').style.setProperty('--pc', p.color);
  $('readyAv').textContent = p.emoji; $('readyNm').textContent = `輪到 ${p.name}`;
  $('readySub').textContent = (settings.rounds > 1 ? `第 ${G.round} 輪・` : '') + `${settings.time} 秒內消越多越好！`;
  renderScores(); $('ready').classList.add('on');
}
$('goBtn').onclick = async () => {
  $('ready').classList.remove('on'); audio();
  newBoard();
  $('count').classList.add('on');
  for (const n of [3, 2, 1]) { $('countN').textContent = n; $('countN').style.animation = 'none'; void $('countN').offsetWidth; $('countN').style.animation = ''; SFX.tick(); await sleep(800); }
  $('count').classList.remove('on'); SFX.go();
  beginTurn();
};
function beginTurn(){
  lastSec = -1; G.elapsed = 0; G.turnScore = 0; G.running = true; G.paused = false; G.lastTick = performance.now(); G.lastMatch = performance.now();
  renderClock();
}

function onTile(i, ev){
  if (!G || !G.running || G.paused) return;
  const t = G.tiles[i]; if (t.gone) return;
  clearHint();
  if (G.sel === i) { tileEl(i).classList.remove('sel'); G.sel = -1; return; }
  if (G.sel < 0) { G.sel = i; tileEl(i).classList.add('sel'); SFX.pick(); return; }
  const a = G.sel; G.sel = -1;
  if (G.tiles[a].k === t.k) {
    [a, i].forEach(x => { G.tiles[x].gone = true; const el = tileEl(x); el.classList.remove('sel'); el.classList.add('gone');
      setTimeout(() => el.classList.add('dead'), 450); });
    const p = G.players[G.cur]; p.score++; G.turnScore++; G.left--; G.lastMatch = performance.now(); G.hinted = false;
    SFX.match(); bumpScore(); updateLeft(); floatPlus(ev);
    if (G.left === 0) boardCleared();
  } else {
    tileEl(a).classList.remove('sel');
    [a, i].forEach(x => { const el = tileEl(x); el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong'); });
    SFX.wrong();
  }
}
function bumpScore(){ const c = $('scores').children[G.cur]; c.querySelector('.sc').textContent = G.players[G.cur].score; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); }
function floatPlus(ev){
  const d = document.createElement('div'); d.className = 'plus'; d.textContent = '+1';
  d.style.setProperty('--pc', G.players[G.cur].color); d.style.left = (ev.clientX - 20) + 'px'; d.style.top = (ev.clientY - 40) + 'px';
  document.body.appendChild(d); setTimeout(() => d.remove(), 900);
}
function toast(text, ms = 1200){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = text; document.body.appendChild(d); setTimeout(() => d.remove(), ms); }

async function boardCleared(){
  SFX.clear();
  if (G.solo) { G.running = false; await sleep(600); return endGame(); }
  // 比賽中提早消完：馬上換一盤繼續
  toast('全部消完！再來一盤 🎉'); await sleep(900);
  if (G.running) newBoard();
}

/* 提示：太久沒消到，就讓一組閃一下 */
function clearHint(){ document.querySelectorAll('.tile.hint').forEach(e => e.classList.remove('hint')); }
function giveHint(){
  const seen = {};
  for (let i = 0; i < G.tiles.length; i++) { const t = G.tiles[i]; if (t.gone) continue;
    if (seen[t.k] !== undefined) { [seen[t.k], i].forEach(x => tileEl(x).classList.add('hint')); return; } seen[t.k] = i; }
}

/* 計時 */
function renderClock(){
  const c = $('clock');
  if (G.solo) { c.textContent = fmt(G.elapsed); c.classList.remove('hurry'); return; }
  const left = Math.max(0, G.limit - G.elapsed);
  c.textContent = fmt(left + 999); c.classList.toggle('hurry', left <= 10000);
  const f = $('barFill'); f.style.transform = `scaleX(${left / G.limit})`; f.style.background = left <= 10000 ? '#FF5E6C' : 'var(--accent)';
}
let lastSec = -1;
setInterval(() => {
  if (!G || !G.running) return;
  const now = performance.now();
  if (!G.paused) {
    G.elapsed += now - G.lastTick;
    if (settings.hint && !G.hinted && now - G.lastMatch > HINT_AFTER) { G.hinted = true; giveHint(); }
  } else G.lastMatch += now - G.lastTick;
  G.lastTick = now; renderClock();
  if (!G.solo && !G.paused) {
    const left = G.limit - G.elapsed, sec = Math.ceil(left / 1000);
    if (sec <= 5 && sec > 0 && sec !== lastSec) { lastSec = sec; SFX.tick(); }
    if (left <= 0) timeUp();
  }
}, 100);

function timeUp(){
  G.running = false; clearHint(); SFX.buzz();
  if (G.sel >= 0) { tileEl(G.sel).classList.remove('sel'); G.sel = -1; }
  const p = G.players[G.cur];
  const last = G.cur === G.players.length - 1 && G.round === settings.rounds;
  $('timeupBox').style.setProperty('--pc', p.color);
  $('tuAv').textContent = p.emoji;
  $('tuMeta').innerHTML = `<b style="color:${p.color}"></b> 這次消了 <b style="font-size:40px;color:${p.color}">${G.turnScore}</b> 組`;
  $('tuMeta').querySelector('b').textContent = p.name;
  $('nextBtn').textContent = last ? '看結果！' : '下一位';
  $('timeup').classList.add('on');
}
$('nextBtn').onclick = () => {
  $('timeup').classList.remove('on');
  if (G.cur === G.players.length - 1) {
    if (G.round === settings.rounds) return endGame();
    G.round++; G.cur = 0;
  } else G.cur++;
  showReady();
};

/* 暫停／回首頁 */
$('pauseBtn').onclick = () => { if (!G) return; G.paused = true; $('pauseModal').classList.add('on'); };
$('resumeBtn').onclick = () => { G.paused = false; G.lastTick = performance.now(); $('pauseModal').classList.remove('on'); };
$('restartBtn').onclick = () => { $('pauseModal').classList.remove('on'); closeAll(); startGame(); };
$('homeBtn').onclick = () => { $('pauseModal').classList.remove('on'); goHome(); };
$('muteBtn').onclick = () => { settings.sound = !settings.sound; save(); $('muteBtn').textContent = settings.sound ? '🔊' : '🔇'; };
function closeAll(){ ['ready','count','timeup','endModal'].forEach(id => $(id).classList.remove('on')); stopConfetti(); }
function goHome(){ G = null; closeAll(); try { wakeLock && wakeLock.release(); } catch(e) {} renderHome(); show('home'); }

/* 結束 */
function endGame(){
  G.running = false;
  let html = '';
  if (G.solo) {
    const p = G.players[0], rec = getRecords()[settings.pairs], isNew = !rec || G.elapsed < rec;
    if (isNew) setRecord(settings.pairs, G.elapsed);
    $('endTitle').textContent = '🎉 全部消完了！';
    html = `<div class="rrow first" style="--pc:${p.color}"><div class="md">🏆</div><div class="av">${p.emoji}</div><div class="nm"></div><div class="sc">${fmt(G.elapsed)}</div></div>`;
    $('endMeta').innerHTML = `${settings.pairs} 組用了 ${fmt(G.elapsed)}` + (isNew ? '<span class="record">新紀錄！</span>' : `<br>最快紀錄是 ${fmt(rec)}`);
    $('rank').innerHTML = html; $('rank').querySelector('.nm').textContent = p.name;
  } else {
    const sorted = [...G.players].sort((a, b) => b.score - a.score), top = sorted[0].score, winners = sorted.filter(p => p.score === top);
    $('endTitle').textContent = winners.length > 1 ? '🎉 平手！大家都好棒！' : `🎉 ${winners[0].name} 贏了！`;
    const medals = ['🥇','🥈','🥉','🎖️']; let rank = 0;
    sorted.forEach((p, i) => { if (i > 0 && p.score < sorted[i - 1].score) rank = i;
      html += `<div class="rrow${rank === 0 ? ' first' : ''}" style="--pc:${p.color}"><div class="md">${medals[rank]}</div><div class="av">${p.emoji}</div><div class="nm"></div><div class="sc">${p.score} 組</div></div>`; });
    $('rank').innerHTML = html; $('rank').querySelectorAll('.nm').forEach((el, i) => el.textContent = sorted[i].name);
    $('endMeta').textContent = `每人 ${settings.time} 秒` + (settings.rounds > 1 ? ` × ${settings.rounds} 輪` : '');
  }
  $('endModal').classList.add('on'); SFX.win(); confetti();
}
$('againBtn').onclick = () => { closeAll(); startGame(); };
$('endHomeBtn').onclick = () => { closeAll(); goHome(); };

let confRAF = 0;
function confetti(){
  const cv = $('confetti'), g = cv.getContext('2d'); cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; g.scale(devicePixelRatio, devicePixelRatio);
  const cols = ['#FF5E6C','#3D8BFF','#22A57E','#B266FF','#FFC93C','#FF8A5B'];
  const ps = Array.from({length:180}, () => ({x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*.6, vx:(Math.random()-.5)*3, vy:2+Math.random()*3, r:Math.random()*6, w:8+Math.random()*8, h:5+Math.random()*6, c:cols[Math.floor(Math.random()*cols.length)], s:(Math.random()-.5)*.3}));
  const t0 = performance.now();
  const step = t => { g.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.r+=p.s; g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle=p.c; g.fillRect(-p.w/2,-p.h/2,p.w,p.h); g.restore(); });
    if (t - t0 < 5000) confRAF = requestAnimationFrame(step); else g.clearRect(0,0,innerWidth,innerHeight); };
  confRAF = requestAnimationFrame(step);
}
function stopConfetti(){ cancelAnimationFrame(confRAF); const cv = $('confetti'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); }

$('startBtn').onclick = startGame;

/* 解密 */
const b64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
async function decryptPhotos(pw){ const d = await decryptRaw(pw); return Array.isArray(d) ? d : d.items.map(it => it[0]); }
async function decryptRaw(pw){
  const e = PHOTOS.enc;
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(e.salt), iterations:e.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(e.iv)}, key, b64(e.data))));
}
async function enterHome(list){ await preparePhotos(list); renderHome(); show('home'); }
/* 共用照片檔：所有遊戲讀同一份（iPad 只下載一次） */
async function loadShared(){
  if (!PHOTOS || !PHOTOS.src) return;
  const ld = document.createElement('div'); ld.id = 'loadingPhotos';
  ld.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;font:800 28px system-ui,sans-serif;color:#888;z-index:9999;background:inherit';
  ld.textContent = '📷 照片載入中…'; document.body.appendChild(ld);
  try { PHOTOS = await (await fetch(PHOTOS.src)).json(); } catch(e) { ld.textContent = '照片載入失敗，請檢查網路後重新整理'; throw e; }
  ld.remove();
}
async function boot(){
  await loadShared();
  if (Array.isArray(PHOTOS)) return enterHome(PHOTOS);
  let saved = null; try { saved = localStorage.getItem('flipgame-pw'); } catch(e) {}
  if (saved) { try { return enterHome(await decryptPhotos(saved)); } catch(e) {} }
  show('lock'); setTimeout(() => $('pw').focus(), 300);
}
$('lockForm').onsubmit = async ev => {
  ev.preventDefault(); const pw = $('pw').value; if (!pw) return;
  $('unlockBtn').disabled = true; $('pwErr').textContent = '';
  try {
    const list = await decryptPhotos(pw);
    try { if ($('remember').checked) localStorage.setItem('flipgame-pw', pw); else localStorage.removeItem('flipgame-pw'); } catch(e) {}
    $('pw').blur(); await enterHome(list);
  } catch(e) {
    $('pwErr').textContent = window.crypto && crypto.subtle ? '密碼不對喔，再試一次' : '這個瀏覽器不支援解鎖，請用 Safari 或 Chrome 打開';
    const box = $('lockForm'); box.classList.remove('bad'); void box.offsetWidth; box.classList.add('bad');
  }
  $('unlockBtn').disabled = false;
};
boot();
</script>
