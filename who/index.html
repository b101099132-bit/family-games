<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<title>這是誰？</title>
<style>
:root{
  --bg:#F3F0FF; --ink:#2E2650; --muted:#7A70A0; --line:#DDD5FA; --panel:#fff;
  --accent:#7B61FF; --accent-d:#5A41D9; --ok:#21B573; --bad:#FF5E6C;
  --p0:#FF5E6C; --p1:#3D8BFF; --p2:#F2A100; --p3:#22A57E;
  --g0:#FF8A5B; --g1:#3DB2FF; --g2:#9B6BFF; --g3:#2FB36D; --g4:#FF5FA2; --g5:#F2A100;
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
body{background:radial-gradient(circle at 12% 16%, #E4DCFF 0 130px, transparent 131px),radial-gradient(circle at 88% 86%, #FFE3EE 0 170px, transparent 171px),var(--bg);}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;}
.screen{position:fixed;inset:0;display:none;}
.screen.on{display:flex;}
.title{font-size:clamp(34px,6vh,64px);font-weight:900;letter-spacing:.06em;margin:.2em 0 .1em;color:var(--accent);text-shadow:0 4px 0 #D6CCFF;}
.title span{display:inline-block;animation:bob 2.4s ease-in-out infinite;}
.title span:nth-child(2n){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.panel{background:var(--panel);border-radius:24px;padding:20px 22px;box-shadow:0 6px 0 var(--line);}
.panel h2{margin:0 0 14px;font-size:22px;}
.seg{display:flex;gap:10px;flex-wrap:wrap;}
.seg button{min-width:64px;height:56px;padding:0 18px;border-radius:16px;background:#F1EEFF;font-size:22px;font-weight:800;box-shadow:0 4px 0 var(--line);}
.seg button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line);}
.seg button.sel{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-d);}
.bigbtn{height:78px;padding:0 54px;border-radius:40px;background:var(--accent);color:#fff;font-size:34px;font-weight:900;letter-spacing:.1em;box-shadow:0 7px 0 var(--accent-d);}
.bigbtn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--accent-d);}
.ghost{height:78px;padding:0 26px;border-radius:40px;background:#fff;font-size:22px;font-weight:800;box-shadow:0 7px 0 var(--line);}

#lock{flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;}
.lockbox{background:#fff;border-radius:30px;padding:32px 36px;box-shadow:0 8px 0 var(--line);width:min(480px,100%);display:flex;flex-direction:column;gap:16px;align-items:center;}
.lockbox .big{font-size:64px;}
#pw{width:100%;height:64px;border-radius:18px;border:3px solid var(--line);font:inherit;font-size:28px;text-align:center;font-weight:800;color:var(--ink);-webkit-user-select:text;user-select:text;}
#pw:focus{outline:none;border-color:var(--accent);}
.lockbox .err{color:#D93A3A;font-weight:800;min-height:1.4em;font-size:18px;}
.lockbox label{font-size:17px;color:var(--muted);display:flex;align-items:center;gap:8px;}
.lockbox label input{width:24px;height:24px;}
.lockbox.bad{animation:shakeX .4s;}
@keyframes shakeX{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}

#home{flex-direction:column;align-items:center;overflow:auto;padding:max(16px,2.5vh) 16px 24px;}
.subtitle{color:var(--muted);font-size:clamp(15px,2.2vh,20px);margin-bottom:max(12px,2vh);text-align:center;}
.home-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;width:min(1100px,100%);}
@media (orientation:portrait),(max-width:820px){.home-grid{grid-template-columns:1fr}}
.players{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
.prow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:18px;background:#F8F6FF;border:3px solid var(--pc);}
.avatar{width:62px;height:62px;border-radius:50%;background:var(--pc);font-size:38px;display:grid;place-items:center;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.12);}
.prow input{flex:1;min-width:0;height:52px;border-radius:14px;border:2px solid var(--line);font:inherit;font-size:24px;font-weight:700;padding:0 14px;color:var(--ink);background:#fff;}
.prow .hint{font-size:13px;color:var(--muted);flex:none;}
.setting{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
.setting label{font-size:18px;font-weight:800;}
.setting small{color:var(--muted);font-weight:500;font-size:14px;}
.kids{display:flex;gap:14px;flex-wrap:wrap;}
.kid{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:900;font-size:20px;}
.kid img{width:76px;height:76px;border-radius:50%;object-fit:cover;border:5px solid var(--gc);box-shadow:0 4px 0 rgba(0,0,0,.1);}
.kid small{font-size:13px;color:var(--muted);font-weight:700}
.warn{padding:12px 14px;border-radius:14px;background:#FFF0F0;color:#A33;font-weight:700;line-height:1.5;}
.startbar{display:flex;gap:14px;justify-content:center;margin-top:22px;flex-wrap:wrap;}

#game{flex-direction:column;align-items:center;}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 14px 4px;align-self:stretch;flex:none;}
.scores{flex:1;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.chip{display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:999px;background:#fff;border:4px solid transparent;box-shadow:0 4px 0 var(--line);opacity:.55;transition:transform .25s,opacity .25s;}
.chip .av{width:clamp(40px,6vh,60px);height:clamp(40px,6vh,60px);border-radius:50%;background:var(--pc);display:grid;place-items:center;font-size:clamp(24px,3.6vh,38px);}
.chip .nm{font-size:clamp(16px,2.4vh,24px);font-weight:800;white-space:nowrap;max-width:18vw;overflow:hidden;text-overflow:ellipsis;}
.chip .sc{font-size:clamp(26px,4.2vh,44px);font-weight:900;color:var(--pc);min-width:1.2em;text-align:center;}
.chip.cur{opacity:1;border-color:var(--pc);transform:scale(1.08);box-shadow:0 0 0 6px color-mix(in srgb,var(--pc) 22%,transparent),0 6px 0 var(--line);}
.solo .chip{opacity:1}
.chip.pop .sc{animation:pop .45s;}
@keyframes pop{40%{transform:scale(1.7)}}
.status{display:flex;align-items:center;gap:10px;flex:none;}
.prog{font-size:clamp(16px,2.4vh,24px);font-weight:900;background:#fff;padding:6px 14px;border-radius:14px;box-shadow:0 4px 0 var(--line);}
.icon{width:clamp(44px,6vh,60px);height:clamp(44px,6vh,60px);border-radius:16px;background:#fff;font-size:clamp(22px,3.2vh,30px);box-shadow:0 4px 0 var(--line);}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2vh,22px);padding:8px 16px 18px;width:100%;}
.ask{font-size:clamp(26px,4.4vh,44px);font-weight:900;display:flex;align-items:center;gap:12px;}
.ask .who{color:var(--pc);}
.photo{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%;}
.photo img{max-width:min(92vw,1000px);max-height:100%;border-radius:24px;border:10px solid #fff;box-shadow:0 10px 0 var(--line),0 10px 30px rgba(60,40,120,.15);animation:photoIn .45s cubic-bezier(.3,1.4,.5,1);}
@keyframes photoIn{from{transform:scale(.6) rotate(-4deg);opacity:0}}
.verdict{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(34px,7vh,72px);font-weight:900;color:#fff;
  padding:16px 44px;border-radius:999px;white-space:nowrap;animation:zoomIn .35s cubic-bezier(.3,1.6,.5,1);box-shadow:0 8px 0 rgba(0,0,0,.15);pointer-events:none;}
.verdict.ok{background:var(--ok);} .verdict.bad{background:var(--bad);}
@keyframes zoomIn{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
.answers{display:flex;gap:clamp(14px,3vw,40px);justify-content:center;flex-wrap:wrap;flex:none;}
.ans{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 18px 12px;border-radius:28px;background:#fff;box-shadow:0 7px 0 var(--line);
  transition:transform .15s, background .2s;min-width:clamp(120px,14vw,190px);}
.ans:active{transform:translateY(5px);box-shadow:0 2px 0 var(--line);}
.ans img{width:clamp(80px,12vh,130px);height:clamp(80px,12vh,130px);border-radius:50%;object-fit:cover;border:6px solid var(--gc);}
.ans span{font-size:clamp(24px,3.8vh,38px);font-weight:900;color:var(--gc);}
.ans.right{background:var(--ok);animation:bounce .5s;} .ans.right span{color:#fff;}
.ans.wrong{background:var(--bad);animation:shakeX .4s;} .ans.wrong span{color:#fff;}
.ans.dim{opacity:.4;}
@keyframes bounce{40%{transform:scale(1.15)}}

.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50;}
.overlay.on{display:flex;}
.modal{background:rgba(40,30,80,.5);}
.box{background:#fff;border-radius:30px;padding:30px 36px;min-width:min(520px,90vw);max-width:92vw;text-align:center;box-shadow:0 10px 0 var(--line);}
.box h2{font-size:clamp(30px,5vh,46px);margin:0 0 18px;}
.col{display:flex;flex-direction:column;gap:14px;align-items:center;}
.col .bigbtn,.col .ghost{width:min(380px,80vw);}
.rank{display:flex;flex-direction:column;gap:12px;margin:6px 0 22px;}
.rrow{display:flex;align-items:center;gap:16px;padding:10px 20px;border-radius:20px;background:#F8F6FF;border:4px solid var(--pc);}
.rrow .md{font-size:44px;width:56px}
.rrow .av{width:60px;height:60px;border-radius:50%;background:var(--pc);display:grid;place-items:center;font-size:36px}
.rrow .nm{flex:1;text-align:left;font-size:30px;font-weight:900}
.rrow .sc{font-size:36px;font-weight:900;color:var(--pc)}
.rrow.first{transform:scale(1.04);background:#FFF6D6}
.stars{font-size:56px;letter-spacing:6px;margin:4px 0 10px;}
.meta{font-size:22px;color:var(--muted);font-weight:700;margin-bottom:18px;line-height:1.5}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;}
</style>
</head>
<body>

<section id="lock" class="screen">
  <div class="title"><span>這</span><span>是</span><span>誰</span><span>？</span></div>
  <form class="lockbox" id="lockForm" autocomplete="off">
    <div class="big">🔒</div>
    <div style="font-size:22px;font-weight:800">請輸入家庭密碼</div>
    <input id="pw" type="password" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label><input type="checkbox" id="remember" checked>記住這台裝置，下次不用再輸入</label>
    <div class="err" id="pwErr"></div>
    <button class="bigbtn" id="unlockBtn" type="submit">打開</button>
  </form>
</section>

<section id="home" class="screen">
  <div class="title"><span>這</span><span>是</span><span>誰</span><span>？</span></div>
  <div class="subtitle">看照片，猜猜這是哪個寶貝！</div>
  <div class="home-grid">
    <div class="panel">
      <h2>👨‍👩‍👧 幾個人玩？</h2>
      <div class="seg" id="segPlayers"></div>
      <div class="players" id="playerRows"></div>
    </div>
    <div class="panel">
      <div class="setting"><label>👶 照片裡的寶貝 <small>照 photos 裡的資料夾分</small></label><div class="kids" id="kids"></div></div>
      <div class="setting"><label>❓ 每人幾題</label><div class="seg" id="segQ"></div></div>
      <div class="setting" style="margin-bottom:0"><label>🔊 音效</label><div class="seg" id="segSound"></div></div>
    </div>
  </div>
  <div class="startbar">
    <button class="ghost" onclick="location.href='../'">🏠 遊戲選單</button>
    <button class="ghost" id="fsBtn">⛶ 全螢幕</button>
    <button class="bigbtn" id="startBtn">開始玩！</button>
  </div>
</section>

<section id="game" class="screen">
  <div class="topbar">
    <div class="scores" id="scores"></div>
    <div class="status">
      <div class="prog" id="prog"></div>
      <button class="icon" id="muteBtn">🔊</button>
      <button class="icon" id="pauseBtn">⏸️</button>
    </div>
  </div>
  <div class="stage">
    <div class="ask" id="ask"></div>
    <div class="photo" id="photo"></div>
    <div class="answers" id="answers"></div>
  </div>
</section>

<div class="overlay modal" id="pauseModal"><div class="box">
  <h2>暫停一下</h2>
  <div class="col">
    <button class="bigbtn" id="resumeBtn">繼續玩</button>
    <button class="ghost" id="restartBtn">🔄 重新開始</button>
    <button class="ghost" id="homeBtn">🏠 回首頁</button>
  </div>
</div></div>
<div class="overlay modal" id="endModal"><div class="box">
  <h2 id="endTitle"></h2>
  <div id="endBody"></div>
  <div class="col">
    <button class="bigbtn" id="againBtn">再玩一次</button>
    <button class="ghost" id="endHomeBtn">🏠 回首頁</button>
  </div>
</div></div>
<canvas id="confetti"></canvas>

<script>
let PHOTOS = {"src": "../photos.json?v=5dc631653a"};
const $ = id => document.getElementById(id);
const COLORS = ['var(--p0)','var(--p1)','var(--p2)','var(--p3)'];
const GCOLORS = ['var(--g0)','var(--g1)','var(--g2)','var(--g3)','var(--g4)','var(--g5)'];
const ANIMALS = ['🐰','🐻','🐱','🐶','🐼','🦊','🐯','🐸','🐧','🦁','🐵','🐨','🐷','🐮','🦄','🐥'];
const DEFAULT_NAMES = ['玩家1','玩家2','玩家3','玩家4'];

let settings = { count: 1, q: 10, sound: true };
let players = [0,1,2,3].map(i => ({name: DEFAULT_NAMES[i], emoji: ANIMALS[i]}));
try { Object.assign(settings, JSON.parse(localStorage.getItem('whogame-settings') || '{}')); } catch(e) {}
try { const f = JSON.parse(localStorage.getItem('flipgame-settings') || 'null'); if (f && f.players) players = f.players; } catch(e) {}
function save(){ try {
  localStorage.setItem('whogame-settings', JSON.stringify(settings));
  const f = JSON.parse(localStorage.getItem('flipgame-settings') || '{}'); f.players = players; localStorage.setItem('flipgame-settings', JSON.stringify(f));
} catch(e) {} }

/* 照片資料：groups = 寶貝名字；items = [照片, [屬於哪幾個寶貝]] */
let groups = [], items = [], faces = [], pool = [];
function demoData(){
  const kids = [['🐣','#FFD6A5'],['🐥','#CDE7FF'],['🐤','#E4D4FF']];
  const it = [];
  kids.forEach(([e, bg], g) => { for (let n = 0; n < 8; n++) {
    const c = document.createElement('canvas'); c.width = 480; c.height = 360; const x = c.getContext('2d');
    x.fillStyle = bg; x.fillRect(0, 0, 480, 360); x.font = '200px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(e, 240, 190); x.font = 'bold 40px sans-serif'; x.fillStyle = '#0006'; x.fillText(n + 1, 440, 330);
    it.push([c.toDataURL('image/png'), [g]]); } });
  return {groups: ['寶貝A','寶貝B','寶貝C'], items: it};
}
function makeThumb(src, size){
  return new Promise(res => { const im = new Image();
    im.onload = () => { const m = Math.min(im.width, im.height), c = document.createElement('canvas'); c.width = c.height = size;
      c.getContext('2d').drawImage(im, (im.width - m) / 2, Math.max(0, (im.height - m) * .3), m, m, 0, 0, size, size); res(c.toDataURL('image/jpeg', .85)); };
    im.onerror = () => res(src); im.src = src; });
}
async function prepare(data){
  if (!data || !data.items || !data.items.length || (data.groups || []).length < 2) {
    const real = data && data.items && data.items.length;
    if (!real) data = demoData(); else { groups = data.groups || []; items = data.items; return; }
  }
  groups = data.groups; items = data.items;
  // 每個寶貝挑一張只屬於他的照片當大頭貼（這張不會出題）
  const given = data.faces || {};
  const faceIdx = groups.map((_, g) => { if (given[g]) return -1; for (let i = items.length - 1; i >= 0; i--) if (items[i][1].length === 1 && items[i][1][0] === g) return i; return -1; });
  faces = await Promise.all(groups.map((_, g) => given[g] ? makeThumb(given[g], 200) : faceIdx[g] >= 0 ? makeThumb(items[faceIdx[g]][0], 200) : ''));
  pool = items.map((it, i) => i).filter(i => items[i][1].length > 0 && !faceIdx.includes(i));
}

/* 音效 */
let actx = null;
function audio(){ if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
function tone(f, d, {type='sine', vol=.18, at=0, slide=0} = {}){
  if (!settings.sound) return; const a = audio(); if (!a) return;
  const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .05);
}
const SFX = {
  pick(){ tone(700, .07, {type:'triangle', vol:.13}); },
  show(){ tone(520, .12, {type:'triangle', slide:780, vol:.12}); },
  ok(){ [659,784,1047].forEach((f,i) => tone(f, .2, {type:'triangle', at:i*.09})); },
  bad(){ tone(300, .2, {vol:.14, slide:220}); tone(220, .3, {vol:.12, at:.18}); },
  win(){ [523,523,523,659,587,659,784,1047].forEach((f,i) => tone(f, .26, {type:'triangle', at:[0,.15,.3,.45,.75,.9,1.05,1.3][i], vol:.2})); }
};

/* 首頁 */
function seg(el, opts, cur, pick){ el.innerHTML = '';
  opts.forEach(([v, l]) => { const b = document.createElement('button'); b.textContent = l; if (v === cur) b.classList.add('sel');
    b.onclick = () => { audio(); SFX.pick(); pick(v); }; el.appendChild(b); }); }
function renderHome(){
  seg($('segPlayers'), [[1,'1 人'],[2,'2 人'],[3,'3 人'],[4,'4 人']], settings.count, v => { settings.count = v; save(); renderHome(); });
  const rows = $('playerRows'); rows.innerHTML = '';
  for (let i = 0; i < settings.count; i++) {
    const p = players[i], r = document.createElement('div'); r.className = 'prow'; r.style.setProperty('--pc', COLORS[i]);
    r.innerHTML = `<button class="avatar">${p.emoji}</button><input maxlength="6"><span class="hint">點動物可以換</span>`;
    r.querySelector('input').value = p.name;
    r.querySelector('.avatar').onclick = e => { audio(); SFX.pick(); const used = players.slice(0, settings.count).map(x => x.emoji); let k = ANIMALS.indexOf(p.emoji);
      do { k = (k + 1) % ANIMALS.length; } while (used.includes(ANIMALS[k]) && ANIMALS[k] !== p.emoji); p.emoji = ANIMALS[k]; e.currentTarget.textContent = p.emoji; save(); };
    r.querySelector('input').oninput = e => { p.name = e.target.value; save(); };
    rows.appendChild(r);
  }
  const kb = $('kids'); kb.innerHTML = '';
  if (groups.length < 2) {
    kb.innerHTML = '<div class="warn">要把照片分成至少兩個資料夾（一個寶貝一個資料夾），才能玩「這是誰？」</div>';
    $('startBtn').disabled = true; $('startBtn').style.opacity = .4;
  } else {
    groups.forEach((g, i) => { const n = pool.filter(k => items[k][1].includes(i)).length;
      const d = document.createElement('div'); d.className = 'kid'; d.style.setProperty('--gc', GCOLORS[i % GCOLORS.length]);
      d.innerHTML = `<img src="${faces[i]}" alt=""><div></div><small>${n} 張</small>`; d.children[1].textContent = g; kb.appendChild(d); });
  }
  const maxQ = Math.floor(pool.length / Math.max(1, settings.count));
  const qo = [5,10,15,20].filter(x => x <= maxQ); if (!qo.length && maxQ > 0) qo.push(maxQ);
  if (!qo.includes(settings.q)) settings.q = qo.includes(10) ? 10 : qo[qo.length - 1];
  seg($('segQ'), qo.map(x => [x, `${x} 題`]), settings.q, v => { settings.q = v; save(); renderHome(); });
  seg($('segSound'), [[true,'開'],[false,'關']], settings.sound, v => { settings.sound = v; save(); renderHome(); });
}
const fsEl = document.documentElement;
if (!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen)) $('fsBtn').hidden = true;
$('fsBtn').onclick = () => { try { if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl); } catch(e) {} };

/* 遊戲 */
const sleep = ms => new Promise(r => setTimeout(r, ms));
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
let G = null;

/* 出題：盡量讓每個寶貝出現的次數平均 */
function pickQuestions(n){
  const byG = groups.map((_, g) => shuffle(pool.filter(i => items[i][1][0] === g)));
  const out = []; let g = Math.floor(Math.random() * groups.length), guard = 0;
  while (out.length < n && guard++ < n * groups.length * 2) {
    const list = byG[g % groups.length]; if (list.length) out.push(list.pop()); g++;
  }
  return shuffle(out);
}
function startGame(){
  audio();
  const ps = players.slice(0, settings.count).map((p, i) => ({name: (p.name || '').trim() || DEFAULT_NAMES[i], emoji: p.emoji, color: COLORS[i], score: 0}));
  G = { players: ps, qs: pickQuestions(settings.q * ps.length), qi: 0, lock: false, token: {} };
  $('game').classList.toggle('solo', ps.length === 1);
  $('muteBtn').textContent = settings.sound ? '🔊' : '🔇';
  show('game'); nextQ();
}
function renderScores(){
  const box = $('scores'); box.innerHTML = '';
  G.players.forEach((p, i) => { const c = document.createElement('div'); c.className = 'chip' + (i === cur() ? ' cur' : ''); c.style.setProperty('--pc', p.color);
    c.innerHTML = `<div class="av">${p.emoji}</div><div class="nm"></div><div class="sc">${p.score}</div>`; c.querySelector('.nm').textContent = p.name; box.appendChild(c); });
}
const cur = () => G.qi % G.players.length;
function nextQ(){
  if (G.qi >= G.qs.length) return endGame();
  const k = G.qs[G.qi], p = G.players[cur()];
  renderScores();
  const per = G.players.length, mine = Math.floor(G.qi / per) + 1;
  $('prog').textContent = `第 ${mine} / ${settings.q} 題`;
  $('ask').style.setProperty('--pc', p.color);
  $('ask').innerHTML = per > 1 ? `<span>${p.emoji}</span><span class="who"></span><span>，這是誰？</span>` : '<span>這是誰呢？</span>';
  if (per > 1) $('ask').querySelector('.who').textContent = p.name;
  $('photo').innerHTML = `<img src="${items[k][0]}" alt="">`;
  const ab = $('answers'); ab.innerHTML = '';
  groups.forEach((g, i) => {
    const b = document.createElement('button'); b.className = 'ans'; b.style.setProperty('--gc', GCOLORS[i % GCOLORS.length]);
    b.innerHTML = `<img src="${faces[i]}" alt=""><span></span>`; b.querySelector('span').textContent = g;
    b.onclick = () => answer(i, b); ab.appendChild(b);
  });
  G.lock = false; SFX.show();
}
async function answer(g, btn){
  if (G.lock || G.paused) return; G.lock = true;
  const k = G.qs[G.qi], rights = items[k][1], ok = rights.includes(g), p = G.players[cur()], token = G.token;
  const btns = [...$('answers').children];
  btns.forEach((b, i) => { if (rights.includes(i)) b.classList.add('right'); else if (i === g) b.classList.add('wrong'); else b.classList.add('dim'); });
  const v = document.createElement('div'); v.className = 'verdict ' + (ok ? 'ok' : 'bad');
  v.textContent = ok ? `答對了！是 ${groups[g]} ⭐` : `是 ${rights.map(i => groups[i]).join('、')} 喔！`;
  $('photo').appendChild(v);
  if (ok) { p.score++; SFX.ok(); const c = $('scores').children[cur()]; c.querySelector('.sc').textContent = p.score; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); }
  else SFX.bad();
  await waitTap(ok ? 1600 : 2400, token);
  if (G && token === G.token) { G.qi++; nextQ(); }
}
/* 等一下，或點畫面任何地方就跳下一題 */
function waitTap(ms, token){
  return new Promise(res => { let done = false;
    const fin = () => { if (done) return; done = true; document.removeEventListener('pointerdown', tap, true); res(); };
    const tap = () => { if (G && !G.paused && token === G.token) setTimeout(fin, 50); };
    setTimeout(() => document.addEventListener('pointerdown', tap, true), 500);
    const tick = () => { if (done) return; if (!G || token !== G.token) return fin(); if (G.paused) return setTimeout(tick, 200); ms -= 200; if (ms <= 0) fin(); else setTimeout(tick, 200); };
    setTimeout(tick, 200);
  });
}

$('pauseBtn').onclick = () => { if (!G) return; G.paused = true; $('pauseModal').classList.add('on'); };
$('resumeBtn').onclick = () => { G.paused = false; $('pauseModal').classList.remove('on'); };
$('restartBtn').onclick = () => { $('pauseModal').classList.remove('on'); G.token = {}; startGame(); };
$('homeBtn').onclick = () => { $('pauseModal').classList.remove('on'); goHome(); };
$('muteBtn').onclick = () => { settings.sound = !settings.sound; save(); $('muteBtn').textContent = settings.sound ? '🔊' : '🔇'; };
function goHome(){ if (G) G.token = {}; G = null; $('endModal').classList.remove('on'); stopConfetti(); renderHome(); show('home'); }

function endGame(){
  const ps = G.players, total = settings.q; let html = '';
  if (ps.length === 1) {
    const p = ps[0], r = p.score / total, stars = r >= .9 ? 3 : r >= .6 ? 2 : r > 0 ? 1 : 0;
    $('endTitle').textContent = stars === 3 ? '🎉 太厲害了！' : stars === 2 ? '🎉 很棒喔！' : '🎉 完成了！';
    html = `<div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div><div class="meta">${total} 題答對 <b style="font-size:40px;color:var(--accent)">${p.score}</b> 題</div>`;
  } else {
    const sorted = [...ps].sort((a, b) => b.score - a.score), top = sorted[0].score, winners = sorted.filter(p => p.score === top);
    $('endTitle').textContent = winners.length > 1 ? '🎉 平手！大家都好棒！' : `🎉 ${winners[0].name} 贏了！`;
    const medals = ['🥇','🥈','🥉','🎖️']; let rank = 0; html = '<div class="rank">';
    sorted.forEach((p, i) => { if (i > 0 && p.score < sorted[i - 1].score) rank = i;
      html += `<div class="rrow${rank === 0 ? ' first' : ''}" style="--pc:${p.color}"><div class="md">${medals[rank]}</div><div class="av">${p.emoji}</div><div class="nm"></div><div class="sc">${p.score} / ${total}</div></div>`; });
    html += '</div>';
    $('endBody').innerHTML = html; $('endBody').querySelectorAll('.nm').forEach((el, i) => el.textContent = sorted[i].name);
    $('endModal').classList.add('on'); SFX.win(); confetti(); return;
  }
  $('endBody').innerHTML = html; $('endModal').classList.add('on'); SFX.win(); confetti();
}
$('againBtn').onclick = () => { $('endModal').classList.remove('on'); stopConfetti(); startGame(); };
$('endHomeBtn').onclick = () => goHome();

let confRAF = 0;
function confetti(){
  const cv = $('confetti'), g = cv.getContext('2d'); cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; g.scale(devicePixelRatio, devicePixelRatio);
  const cols = ['#FF5E6C','#3D8BFF','#7B61FF','#21B573','#FFC93C','#FF8A5B'];
  const ps = Array.from({length:180}, () => ({x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*.6, vx:(Math.random()-.5)*3, vy:2+Math.random()*3, r:Math.random()*6, w:8+Math.random()*8, h:5+Math.random()*6, c:cols[Math.floor(Math.random()*cols.length)], s:(Math.random()-.5)*.3}));
  const t0 = performance.now();
  const step = t => { g.clearRect(0,0,innerWidth,innerHeight); ps.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.r+=p.s; g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle=p.c; g.fillRect(-p.w/2,-p.h/2,p.w,p.h); g.restore(); });
    if (t - t0 < 5000) confRAF = requestAnimationFrame(step); else g.clearRect(0,0,innerWidth,innerHeight); };
  confRAF = requestAnimationFrame(step);
}
function stopConfetti(){ cancelAnimationFrame(confRAF); const cv = $('confetti'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); }
$('startBtn').onclick = startGame;

/* 解密 */
const b64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
async function decryptPhotos(pw){
  const e = PHOTOS.enc;
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(e.salt), iterations:e.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(e.iv)}, key, b64(e.data))));
}
async function enterHome(data){ await prepare(data); renderHome(); show('home'); }
/* 共用照片檔：所有遊戲讀同一份（iPad 只下載一次） */
async function loadShared(){
  if (!PHOTOS || !PHOTOS.src) return;
  const ld = document.createElement('div'); ld.id = 'loadingPhotos';
  ld.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;font:800 28px system-ui,sans-serif;color:#888;z-index:9999;background:inherit';
  ld.textContent = '📷 照片載入中…'; document.body.appendChild(ld);
  try { PHOTOS = await (await fetch(PHOTOS.src)).json(); } catch(e) { ld.textContent = '照片載入失敗，請檢查網路後重新整理'; throw e; }
  ld.remove();
}
async function boot(){
  await loadShared();
  if (!PHOTOS.enc) return enterHome(Array.isArray(PHOTOS) ? null : PHOTOS);
  let saved = null; try { saved = localStorage.getItem('flipgame-pw'); } catch(e) {}
  if (saved) { try { return enterHome(await decryptPhotos(saved)); } catch(e) {} }
  show('lock'); setTimeout(() => $('pw').focus(), 300);
}
$('lockForm').onsubmit = async ev => {
  ev.preventDefault(); const pw = $('pw').value; if (!pw) return;
  $('unlockBtn').disabled = true; $('pwErr').textContent = '';
  try { const data = await decryptPhotos(pw);
    try { if ($('remember').checked) localStorage.setItem('flipgame-pw', pw); else localStorage.removeItem('flipgame-pw'); } catch(e) {}
    $('pw').blur(); await enterHome(data);
  } catch(e) {
    $('pwErr').textContent = window.crypto && crypto.subtle ? '密碼不對喔，再試一次' : '這個瀏覽器不支援解鎖，請用 Safari 或 Chrome 打開';
    const box = $('lockForm'); box.classList.remove('bad'); void box.offsetWidth; box.classList.add('bad');
  }
  $('unlockBtn').disabled = false;
};
boot();
