<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<title>記憶燈燈</title>
<style>
:root{
  --bg:#EEF0FF; --ink:#262B55; --muted:#6E74A6; --line:#D6DAFA; --panel:#fff;
  --accent:#5B6CFF; --accent-d:#3F4FDB; --ok:#21B573; --bad:#FF5E6C;
  --p0:#FF5E6C; --p1:#3D8BFF; --p2:#F2A100; --p3:#22A57E;
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
body{background:radial-gradient(circle at 12% 16%, #DDE1FF 0 130px, transparent 131px),radial-gradient(circle at 88% 86%, #FFF0C9 0 170px, transparent 171px),var(--bg);}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;}
.screen{position:fixed;inset:0;display:none;}
.screen.on{display:flex;}
.title{font-size:clamp(34px,6vh,64px);font-weight:900;letter-spacing:.06em;margin:.2em 0 .1em;color:var(--accent);text-shadow:0 4px 0 #CCD2FF;}
.title span{display:inline-block;animation:bob 2.4s ease-in-out infinite;}
.title span:nth-child(2n){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.panel{background:var(--panel);border-radius:24px;padding:20px 22px;box-shadow:0 6px 0 var(--line);}
.panel h2{margin:0 0 14px;font-size:22px;}
.seg{display:flex;gap:10px;flex-wrap:wrap;}
.seg button{min-width:64px;height:56px;padding:0 18px;border-radius:16px;background:#F0F2FF;font-size:22px;font-weight:800;box-shadow:0 4px 0 var(--line);}
.seg button.sel{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-d);}
.bigbtn{height:78px;padding:0 54px;border-radius:40px;background:var(--accent);color:#fff;font-size:34px;font-weight:900;letter-spacing:.1em;box-shadow:0 7px 0 var(--accent-d);}
.bigbtn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--accent-d);}
.btn2{height:78px;padding:0 26px;border-radius:40px;background:#fff;font-size:22px;font-weight:800;box-shadow:0 7px 0 var(--line);}

#lock{flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;}
.lockbox{background:#fff;border-radius:30px;padding:32px 36px;box-shadow:0 8px 0 var(--line);width:min(480px,100%);display:flex;flex-direction:column;gap:16px;align-items:center;}
.lockbox .big{font-size:64px;}
#pw{width:100%;height:64px;border-radius:18px;border:3px solid var(--line);font:inherit;font-size:28px;text-align:center;font-weight:800;color:var(--ink);-webkit-user-select:text;user-select:text;}
#pw:focus{outline:none;border-color:var(--accent);}
.lockbox .err{color:#D93A3A;font-weight:800;min-height:1.4em;font-size:18px;}
.lockbox label{font-size:17px;color:var(--muted);display:flex;align-items:center;gap:8px;}
.lockbox label input{width:24px;height:24px;}
.lockbox.bad{animation:shakeX .4s;}
@keyframes shakeX{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}

#home{flex-direction:column;align-items:center;overflow:auto;padding:max(16px,2.5vh) 16px 24px;}
.subtitle{color:var(--muted);font-size:clamp(15px,2.2vh,20px);margin-bottom:max(12px,2vh);text-align:center;}
.home-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;width:min(1100px,100%);}
@media (orientation:portrait),(max-width:820px){.home-grid{grid-template-columns:1fr}}
.players{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
.prow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:18px;background:#F7F8FF;border:3px solid var(--pc);}
.avatar{width:62px;height:62px;border-radius:50%;background:var(--pc);font-size:38px;display:grid;place-items:center;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.12);}
.prow input{flex:1;min-width:0;height:52px;border-radius:14px;border:2px solid var(--line);font:inherit;font-size:24px;font-weight:700;padding:0 14px;color:var(--ink);background:#fff;}
.prow .hint{font-size:13px;color:var(--muted);flex:none;}
.setting{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
.setting label{font-size:18px;font-weight:800;}
.setting small{color:var(--muted);font-weight:500;font-size:14px;}
.note{margin-top:14px;padding:12px 14px;border-radius:14px;background:#FFF7DE;color:#7A5A00;font-size:16px;font-weight:700;line-height:1.5;}
.startbar{display:flex;gap:14px;justify-content:center;margin-top:22px;flex-wrap:wrap;}

#game{flex-direction:column;}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 14px 4px;flex:none;}
.scores{flex:1;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.chip{display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:999px;background:#fff;border:4px solid transparent;box-shadow:0 4px 0 var(--line);opacity:.55;transition:transform .25s,opacity .25s;}
.chip .av{width:clamp(40px,6vh,60px);height:clamp(40px,6vh,60px);border-radius:50%;background:var(--pc);display:grid;place-items:center;font-size:clamp(24px,3.6vh,38px);}
.chip .nm{font-size:clamp(16px,2.4vh,24px);font-weight:800;white-space:nowrap;max-width:16vw;overflow:hidden;text-overflow:ellipsis;}
.chip .sc{font-size:clamp(22px,3.6vh,36px);font-weight:900;color:var(--pc);min-width:1.2em;text-align:center;}
.chip .sc small{font-size:.5em;}
.chip.cur{opacity:1;border-color:var(--pc);transform:scale(1.08);}
.solo .chip{opacity:1}
.status{display:flex;align-items:center;gap:10px;flex:none;}
.badge{font-size:clamp(18px,2.8vh,28px);font-weight:900;background:#fff;padding:6px 16px;border-radius:14px;box-shadow:0 4px 0 var(--line);}
.hearts{font-size:clamp(22px,3.4vh,34px);letter-spacing:2px;}
.icon{width:clamp(44px,6vh,60px);height:clamp(44px,6vh,60px);border-radius:16px;background:#fff;font-size:clamp(22px,3.2vh,30px);box-shadow:0 4px 0 var(--line);}
.msg{text-align:center;font-size:clamp(26px,4.6vh,46px);font-weight:900;min-height:1.4em;margin:4px 0 6px;flex:none;}
.msg.go{color:var(--accent);animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{50%{transform:scale(1.06)}}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 16px 18px;}
#grid{display:grid;gap:clamp(8px,1.4vh,14px);}
.c{border-radius:22%;background:#fff;box-shadow:0 6px 0 var(--line);position:relative;overflow:hidden;transition:transform .12s;}
.c img,.c .em{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .12s;}
.c .em{display:grid;place-items:center;font-size:calc(var(--cs)*.6);background:#FFF3C4;}
.c.on{transform:scale(1.08);box-shadow:0 0 0 6px var(--accent),0 10px 24px rgba(91,108,255,.4);}
.c.on img,.c.on .em{opacity:1;}
.plain .c.on{background:#FFD43B;}
.c .n{position:absolute;right:8%;top:6%;font-size:calc(var(--cs)*.26);font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.6);z-index:2;}
.c.ok{box-shadow:0 0 0 6px var(--ok);}
.c.bad{box-shadow:0 0 0 6px var(--bad);animation:shakeX .4s;}
.c.disabled{pointer-events:none;}

.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50;}
.overlay.on{display:flex;}
.modal{background:rgba(30,30,80,.5);}
.box{background:#fff;border-radius:30px;padding:30px 36px;min-width:min(520px,90vw);max-width:92vw;text-align:center;box-shadow:0 10px 0 var(--line);}
.box h2{font-size:clamp(30px,5vh,46px);margin:0 0 14px;}
.col{display:flex;flex-direction:column;gap:14px;align-items:center;}
.col .bigbtn,.col .btn2{width:min(380px,80vw);}
.readyAv{width:120px;height:120px;border-radius:50%;background:var(--pc);display:grid;place-items:center;font-size:76px;margin:0 auto 12px;}
.readyNm{font-size:clamp(32px,5.5vh,52px);font-weight:900;color:var(--pc);margin-bottom:6px;}
.meta{font-size:22px;color:var(--muted);font-weight:700;margin-bottom:18px;line-height:1.5}
.rank{display:flex;flex-direction:column;gap:12px;margin:6px 0 20px;}
.rrow{display:flex;align-items:center;gap:16px;padding:10px 20px;border-radius:20px;background:#F7F8FF;border:4px solid var(--pc);}
.rrow .md{font-size:44px;width:56px}
.rrow .av{width:60px;height:60px;border-radius:50%;background:var(--pc);display:grid;place-items:center;font-size:36px}
.rrow .nm{flex:1;text-align:left;font-size:30px;font-weight:900}
.rrow .sc{font-size:34px;font-weight:900;color:var(--pc)}
.rrow.first{transform:scale(1.04);background:#FFF6D6}
.record{display:inline-block;background:#FFD43B;color:#5A4300;font-weight:900;padding:4px 14px;border-radius:999px;margin-left:8px;}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;}
</style>
</head>
<body>

<section id="lock" class="screen">
  <div class="title"><span>記</span><span>憶</span><span>燈</span><span>燈</span></div>
  <form class="lockbox" id="lockForm" autocomplete="off">
    <div class="big">🔒</div>
    <div style="font-size:22px;font-weight:800">請輸入家庭密碼</div>
    <input id="pw" type="password" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label><input type="checkbox" id="remember" checked>記住這台裝置，下次不用再輸入</label>
    <div class="err" id="pwErr"></div>
    <button class="bigbtn" id="unlockBtn" type="submit">打開</button>
  </form>
</section>

<section id="home" class="screen">
  <div class="title"><span>記</span><span>憶</span><span>燈</span><span>燈</span></div>
  <div class="subtitle">格子會一個一個亮起來，記住順序，再照同樣的順序點回去！</div>
  <div class="home-grid">
    <div class="panel">
      <h2>👨‍👩‍👧 幾個人玩？</h2>
      <div class="seg" id="segPlayers"></div>
      <div class="players" id="playerRows"></div>
      <div class="note" id="note"></div>
    </div>
    <div class="panel">
      <div class="setting"><label>🔲 格子</label><div class="seg" id="segGrid"></div></div>
      <div class="setting"><label>🖼️ 亮起來時顯示</label><div class="seg" id="segPic"></div></div>
      <div class="setting"><label>🐢 亮燈速度</label><div class="seg" id="segSpeed"></div></div>
      <div class="setting" style="margin-bottom:0"><label>🔊 音效</label><div class="seg" id="segSound"></div></div>
    </div>
  </div>
  <div class="startbar">
    <button class="btn2" onclick="location.href='../'">🏠 遊戲選單</button>
    <button class="btn2" id="fsBtn">⛶ 全螢幕</button>
    <button class="bigbtn" id="startBtn">開始玩！</button>
  </div>
</section>

<section id="game" class="screen">
  <div class="topbar">
    <div class="scores" id="scores"></div>
    <div class="status">
      <div class="badge" id="lvl"></div>
      <div class="hearts" id="hearts"></div>
      <button class="icon" id="muteBtn">🔊</button>
      <button class="icon" id="pauseBtn">⏸️</button>
    </div>
  </div>
  <div class="msg" id="msg"></div>
  <div id="stage"><div id="grid"></div></div>
</section>

<div class="overlay modal" id="ready"><div class="box" id="readyBox">
  <div class="readyAv" id="readyAv"></div>
  <div class="readyNm" id="readyNm"></div>
  <div class="meta">仔細看格子亮起來的順序喔！</div>
  <div class="col"><button class="bigbtn" id="goBtn">準備好了！</button></div>
</div></div>
<div class="overlay modal" id="pauseModal"><div class="box">
  <h2>暫停一下</h2>
  <div class="col">
    <button class="bigbtn" id="resumeBtn">繼續玩</button>
    <button class="btn2" id="homeBtn">🏠 回首頁</button>
  </div>
</div></div>
<div class="overlay modal" id="endModal"><div class="box">
  <h2 id="endTitle"></h2>
  <div class="rank" id="rank"></div>
  <div class="meta" id="endMeta"></div>
  <div class="col">
    <button class="bigbtn" id="againBtn">再玩一次</button>
    <button class="btn2" id="endHomeBtn">🏠 回首頁</button>
  </div>
</div></div>
<canvas id="confetti"></canvas>

<script>
let PHOTOS = {"src": "../photos.json?v=5dc631653a"};
const $ = id => document.getElementById(id);
const COLORS = ['var(--p0)','var(--p1)','var(--p2)','var(--p3)'];
const ANIMALS = ['🐰','🐻','🐱','🐶','🐼','🦊','🐯','🐸','🐧','🦁','🐵','🐨','🐷','🐮','🦄','🐥'];
const PICS = ['🐶','🐱','🐰','🐻','🐼','🦊','🐯','🦁','🐸','🐵','🐧','🐥','🐳','🦋','🐞','🐢','🐙','🦄','🐷','🐮','🍎','🍌','🍓','🍉','⭐'];
const DEFAULT_NAMES = ['玩家1','玩家2','玩家3','玩家4'];
const SPEEDS = { slow: [1000, 450], normal: [750, 320], fast: [520, 220] };   // 亮多久、間隔（毫秒）

let settings = { count: 1, size: 3, pic: 'photo', speed: 'slow', sound: true };
let players = [0,1,2,3].map(i => ({name: DEFAULT_NAMES[i], emoji: ANIMALS[i]}));
try { Object.assign(settings, JSON.parse(localStorage.getItem('spangame-settings') || '{}')); } catch(e) {}
try { const f = JSON.parse(localStorage.getItem('flipgame-settings') || 'null'); if (f && f.players) players = f.players; } catch(e) {}
function save(){ try {
  localStorage.setItem('spangame-settings', JSON.stringify(settings));
  const f = JSON.parse(localStorage.getItem('flipgame-settings') || '{}'); f.players = players; localStorage.setItem('flipgame-settings', JSON.stringify(f));
} catch(e) {} }
function getRecords(){ try { return JSON.parse(localStorage.getItem('spangame-records') || '{}'); } catch(e) { return {}; } }
function setRecord(k, v){ const r = getRecords(); r[k] = v; try { localStorage.setItem('spangame-records', JSON.stringify(r)); } catch(e) {} }

let photos = [], thumbs = [];
function makeThumb(src, size){ return new Promise(res => { const im = new Image(); im.onload = () => { const m = Math.min(im.width, im.height), c = document.createElement('canvas'); c.width = c.height = size;
  c.getContext('2d').drawImage(im, (im.width - m) / 2, Math.max(0, (im.height - m) * .3), m, m, 0, 0, size, size); res(c.toDataURL('image/jpeg', .85)); }; im.onerror = () => res(src); im.src = src; }); }

/* 音效：每一格一個音，像彈琴 */
const NOTES = [523, 587, 659, 698, 784, 880, 988, 1047, 1175, 1319, 1397, 1568, 1760, 1976, 2093, 2349];
let actx = null;
function audio(){ if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
function tone(f, d, {type='sine', vol=.18, at=0, slide=0} = {}){
  if (!settings.sound) return; const a = audio(); if (!a) return;
  const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .05);
}
const SFX = {
  pick(){ tone(700, .07, {type:'triangle', vol:.13}); },
  cell(i){ tone(NOTES[i % NOTES.length] / (i >= NOTES.length ? 2 : 1), .3, {type:'triangle', vol:.16}); },
  ok(){ [784,988,1175,1568].forEach((f,i) => tone(f, .18, {type:'triangle', at:i*.08})); },
  bad(){ tone(300, .2, {vol:.14, slide:200}); tone(200, .35, {vol:.12, at:.18}); },
  win(){ [523,523,523,659,587,659,784,1047].forEach((f,i) => tone(f, .26, {type:'triangle', at:[0,.15,.3,.45,.75,.9,1.05,1.3][i], vol:.2})); }
};

/* 首頁 */
function seg(el, opts, cur, pick){ el.innerHTML = '';
  opts.forEach(([v, l]) => { const b = document.createElement('button'); b.textContent = l; if (v === cur) b.classList.add('sel'); b.onclick = () => { audio(); SFX.pick(); pick(v); }; el.appendChild(b); }); }
function renderHome(){
  seg($('segPlayers'), [[1,'1 人'],[2,'2 人'],[3,'3 人'],[4,'4 人']], settings.count, v => { settings.count = v; save(); renderHome(); });
  const rows = $('playerRows'); rows.innerHTML = '';
  for (let i = 0; i < settings.count; i++) {
    const p = players[i], r = document.createElement('div'); r.className = 'prow'; r.style.setProperty('--pc', COLORS[i]);
    r.innerHTML = `<button class="avatar">${p.emoji}</button><input maxlength="6"><span class="hint">點動物可以換</span>`;
    r.querySelector('input').value = p.name;
    r.querySelector('.avatar').onclick = e => { audio(); SFX.pick(); const used = players.slice(0, settings.count).map(x => x.emoji); let k = ANIMALS.indexOf(p.emoji);
      do { k = (k + 1) % ANIMALS.length; } while (used.includes(ANIMALS[k]) && ANIMALS[k] !== p.emoji); p.emoji = ANIMALS[k]; e.currentTarget.textContent = p.emoji; save(); };
    r.querySelector('input').oninput = e => { p.name = e.target.value; save(); };
    rows.appendChild(r);
  }
  const rec = getRecords()[settings.size];
  $('note').innerHTML = settings.count === 1
    ? `從 2 格開始，記對了就多一格。有 3 顆愛心 ❤️，用完就結束。` + (rec ? `<br>目前最高紀錄：<b>${rec} 格</b>` : '')
    : `大家輪流玩，每人 2 顆愛心 ❤️，看誰記得的格子最多！`;
  seg($('segGrid'), [[3,'3×3'],[4,'4×4'],[5,'5×5']], settings.size, v => { settings.size = v; save(); renderHome(); });
  seg($('segPic'), photos.length ? [['photo','家人照片'],['emoji','小動物'],['none','只亮燈']] : [['emoji','小動物'],['none','只亮燈']], settings.pic, v => { settings.pic = v; save(); renderHome(); });
  seg($('segSpeed'), [['slow','慢'],['normal','普通'],['fast','快']], settings.speed, v => { settings.speed = v; save(); renderHome(); });
  seg($('segSound'), [[true,'開'],[false,'關']], settings.sound, v => { settings.sound = v; save(); renderHome(); });
}
const fsEl = document.documentElement;
if (!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen)) $('fsBtn').hidden = true;
$('fsBtn').onclick = () => { try { if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl); } catch(e) {} };

/* 遊戲 */
const sleep = ms => new Promise(r => setTimeout(r, ms));
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
let G = null;

function startGame(){
  audio();
  const ps = players.slice(0, settings.count).map((p, i) => ({name: (p.name || '').trim() || DEFAULT_NAMES[i], emoji: p.emoji, color: COLORS[i], best: 0}));
  const N = settings.size * settings.size;
  if (settings.pic === 'photo' && !photos.length) settings.pic = 'emoji';
  const pics = settings.pic === 'photo' ? shuffle(thumbs.slice()).slice(0, N) : shuffle(PICS.slice()).slice(0, N);
  G = { players: ps, cur: 0, N, pics, k: 2, lives: 0, seq: [], input: 0, busy: true, token: {} };
  $('game').classList.toggle('solo', ps.length === 1);
  $('muteBtn').textContent = settings.sound ? '🔊' : '🔇';
  buildGrid(); show('game'); fitGrid();
  if (ps.length === 1) { G.lives = 3; renderTop(); nextRound(); } else showReady();
}
function buildGrid(){
  const g = $('grid'); g.innerHTML = ''; g.classList.toggle('plain', settings.pic === 'none'); g.style.gridTemplateColumns = `repeat(${settings.size}, var(--cs))`;
  for (let i = 0; i < G.N; i++) {
    const d = document.createElement('div'); d.className = 'c disabled';
    if (settings.pic === 'photo') d.innerHTML = `<img src="${G.pics[i]}" alt="">`;
    else if (settings.pic === 'emoji') d.innerHTML = `<div class="em">${G.pics[i]}</div>`;
    d.insertAdjacentHTML('beforeend', '<span class="n"></span>');
    d.addEventListener('pointerdown', () => tap(i));
    g.appendChild(d);
  }
}
function fitGrid(){
  if (!G) return;
  const st = $('stage'), n = settings.size, gap = Math.min(14, Math.max(8, st.clientHeight * .014));
  const s = Math.floor(Math.min((st.clientWidth - 32 - gap * (n - 1)) / n, (st.clientHeight - 24 - gap * (n - 1)) / n));
  $('grid').style.setProperty('--cs', s + 'px'); $('grid').style.gridAutoRows = s + 'px';
}
addEventListener('resize', fitGrid);
const cell = i => $('grid').children[i];
function renderTop(){
  const box = $('scores'); box.innerHTML = '';
  G.players.forEach((p, i) => { const c = document.createElement('div'); c.className = 'chip' + (i === G.cur ? ' cur' : ''); c.style.setProperty('--pc', p.color);
    c.innerHTML = `<div class="av">${p.emoji}</div><div class="nm"></div><div class="sc">${p.best}<small> 格</small></div>`; c.querySelector('.nm').textContent = p.name; box.appendChild(c); });
  $('lvl').textContent = `${G.k} 格`;
  $('hearts').textContent = '❤️'.repeat(G.lives) + '🤍'.repeat(Math.max(0, (G.players.length === 1 ? 3 : 2) - G.lives));
}
function showReady(){
  const p = G.players[G.cur];
  $('readyBox').style.setProperty('--pc', p.color); $('readyAv').textContent = p.emoji; $('readyNm').textContent = `輪到 ${p.name}`;
  G.k = 2; G.lives = 2; renderTop(); $('ready').classList.add('on');
}
$('goBtn').onclick = () => { $('ready').classList.remove('on'); audio(); nextRound(); };
function setMsg(t, go){ $('msg').textContent = t; $('msg').classList.toggle('go', !!go); }
function clearCells(){ for (let i = 0; i < G.N; i++) { const c = cell(i); c.className = 'c disabled'; c.querySelector('.n').textContent = ''; } }

async function nextRound(){
  const token = G.token; G.busy = true; G.input = 0; renderTop(); clearCells();
  const pool = shuffle([...Array(G.N).keys()]); G.seq = pool.slice(0, Math.min(G.k, G.N));
  setMsg('👀 仔細看…'); await sleep(900); if (token !== G.token) return;
  const [on, off] = SPEEDS[settings.speed];
  for (const i of G.seq) {
    while (G.paused) { await sleep(150); if (token !== G.token) return; }
    cell(i).classList.add('on'); SFX.cell(i); await sleep(on); if (token !== G.token) return;
    cell(i).classList.remove('on'); await sleep(off); if (token !== G.token) return;
  }
  setMsg('👆 換你點！', true);
  for (let i = 0; i < G.N; i++) cell(i).classList.remove('disabled');
  G.busy = false;
}
async function tap(i){
  if (!G || G.busy || G.paused) return;
  const c = cell(i), token = G.token;
  if (G.seq[G.input] === i) {
    G.input++; SFX.cell(i);
    c.classList.add('on'); c.querySelector('.n').textContent = G.input;
    setTimeout(() => { if (token === G.token) { c.classList.remove('on'); c.classList.add('ok'); } }, 260);
    if (G.input === G.seq.length) {
      G.busy = true; await sleep(450); if (token !== G.token) return;
      const p = G.players[G.cur]; p.best = Math.max(p.best, G.k);
      SFX.ok(); setMsg(`🎉 答對了！${G.k} 格都記住了！`);
      await sleep(1300); if (token !== G.token) return;
      G.k = Math.min(G.N, G.k + 1); nextRound();
    }
  } else {
    G.busy = true; SFX.bad(); c.classList.add('bad'); G.lives--; renderTop();
    setMsg('哎呀，再看一次正確的順序');
    await sleep(800); if (token !== G.token) return;
    clearCells();
    for (let n = 0; n < G.seq.length; n++) { const j = G.seq[n]; cell(j).classList.add('on'); cell(j).querySelector('.n').textContent = n + 1; SFX.cell(j); await sleep(520); if (token !== G.token) return; cell(j).classList.remove('on'); }
    await sleep(500); if (token !== G.token) return;
    if (G.lives > 0) { G.k = Math.max(2, G.k - 1); nextRound(); }
    else turnOver();
  }
}
function turnOver(){
  if (G.players.length > 1 && G.cur < G.players.length - 1) { G.cur++; showReady(); return; }
  endGame();
}

$('pauseBtn').onclick = () => { if (!G) return; G.paused = true; $('pauseModal').classList.add('on'); };
$('resumeBtn').onclick = () => { G.paused = false; $('pauseModal').classList.remove('on'); };
$('homeBtn').onclick = () => { $('pauseModal').classList.remove('on'); goHome(); };
$('muteBtn').onclick = () => { settings.sound = !settings.sound; save(); $('muteBtn').textContent = settings.sound ? '🔊' : '🔇'; };
function goHome(){ if (G) G.token = {}; G = null; ['ready','endModal'].forEach(id => $(id).classList.remove('on')); stopConfetti(); renderHome(); show('home'); }

function endGame(){
  let html = '';
  if (G.players.length === 1) {
    const p = G.players[0], rec = getRecords()[settings.size], isNew = p.best > (rec || 0);
    if (isNew) setRecord(settings.size, p.best);
    $('endTitle').textContent = p.best >= 5 ? '🎉 記憶力超強！' : '🎉 好棒喔！';
    html = `<div class="rrow first" style="--pc:${p.color}"><div class="md">🏆</div><div class="av">${p.emoji}</div><div class="nm"></div><div class="sc">${p.best} 格</div></div>`;
    $('rank').innerHTML = html; $('rank').querySelector('.nm').textContent = p.name;
    $('endMeta').innerHTML = `${settings.size}×${settings.size} 最多記住 ${p.best} 格` + (isNew && p.best ? '<span class="record">新紀錄！</span>' : rec ? `<br>最高紀錄是 ${rec} 格` : '');
  } else {
    const sorted = [...G.players].sort((a, b) => b.best - a.best), top = sorted[0].best, winners = sorted.filter(p => p.best === top);
    $('endTitle').textContent = winners.length > 1 ? '🎉 平手！大家都好棒！' : `🎉 ${winners[0].name} 記得最多！`;
    const medals = ['🥇','🥈','🥉','🎖️']; let rank = 0;
    sorted.forEach((p, i) => { if (i > 0 && p.best < sorted[i - 1].best) rank = i;
      html += `<div class="rrow${rank === 0 ? ' first' : ''}" style="--pc:${p.color}"><div class="md">${medals[rank]}</div><div class="av">${p.emoji}</div><div class="nm"></div><div class="sc">${p.best} 格</div></div>`; });
    $('rank').innerHTML = html; $('rank').querySelectorAll('.nm').forEach((el, i) => el.textContent = sorted[i].name);
    $('endMeta').textContent = `${settings.size}×${settings.size}`;
  }
  $('endModal').classList.add('on'); SFX.win(); confetti();
}
$('againBtn').onclick = () => { $('endModal').classList.remove('on'); stopConfetti(); startGame(); };
$('endHomeBtn').onclick = () => goHome();
$('startBtn').onclick = startGame;

let confRAF = 0;
function confetti(){
  const cv = $('confetti'), g = cv.getContext('2d'); cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; g.scale(devicePixelRatio, devicePixelRatio);
  const cols = ['#FF5E6C','#3D8BFF','#5B6CFF','#21B573','#FFC93C','#FF8A5B'];
  const ps = Array.from({length:160}, () => ({x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*.6, vx:(Math.random()-.5)*3, vy:2+Math.random()*3, r:Math.random()*6, w:8+Math.random()*8, h:5+Math.random()*6, c:cols[Math.floor(Math.random()*cols.length)], s:(Math.random()-.5)*.3}));
  const t0 = performance.now();
  const step = t => { g.clearRect(0,0,innerWidth,innerHeight); ps.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.r+=p.s; g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle=p.c; g.fillRect(-p.w/2,-p.h/2,p.w,p.h); g.restore(); });
    if (t - t0 < 4500) confRAF = requestAnimationFrame(step); else g.clearRect(0,0,innerWidth,innerHeight); };
  confRAF = requestAnimationFrame(step);
}
function stopConfetti(){ cancelAnimationFrame(confRAF); const cv = $('confetti'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); }

/* 共用照片檔＋解密 */
async function loadShared(){
  if (!PHOTOS || !PHOTOS.src) return;
  const ld = document.createElement('div'); ld.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;font:800 28px system-ui,sans-serif;color:#888;z-index:9999;background:inherit';
  ld.textContent = '📷 照片載入中…'; document.body.appendChild(ld);
  try { PHOTOS = await (await fetch(PHOTOS.src)).json(); } catch(e) { ld.textContent = '照片載入失敗，請檢查網路後重新整理'; throw e; }
  ld.remove();
}
const b64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
async function decryptPhotos(pw){
  const e = PHOTOS.enc;
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(e.salt), iterations:e.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const d = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(e.iv)}, key, b64(e.data))));
  return Array.isArray(d) ? d : d.items.map(it => it[0]);
}
async function enterHome(list){
  photos = list || [];
  thumbs = await Promise.all(shuffle(photos.slice()).slice(0, 25).map(p => makeThumb(p, 260)));
  if (!photos.length && settings.pic === 'photo') settings.pic = 'emoji';
  renderHome(); show('home');
}
async function boot(){
  await loadShared();
  if (!PHOTOS || !PHOTOS.enc) return enterHome(Array.isArray(PHOTOS) ? PHOTOS : (PHOTOS && PHOTOS.items ? PHOTOS.items.map(it => it[0]) : []));
  let saved = null; try { saved = localStorage.getItem('flipgame-pw'); } catch(e) {}
  if (saved) { try { return enterHome(await decryptPhotos(saved)); } catch(e) {} }
  show('lock'); setTimeout(() => $('pw').focus(), 300);
}
$('lockForm').onsubmit = async ev => {
  ev.preventDefault(); const pw = $('pw').value; if (!pw) return;
  $('unlockBtn').disabled = true; $('pwErr').textContent = '';
  try { const list = await decryptPhotos(pw);
    try { if ($('remember').checked) localStorage.setItem('flipgame-pw', pw); else localStorage.removeItem('flipgame-pw'); } catch(e) {}
    $('pw').blur(); await enterHome(list);
  } catch(e) {
    $('pwErr').textContent = window.crypto && crypto.subtle ? '密碼不對喔，再試一次' : '這個瀏覽器不支援解鎖，請用 Safari 或 Chrome 打開';
    const box = $('lockForm'); box.classList.remove('bad'); void box.offsetWidth; box.classList.add('bad');
  }
  $('unlockBtn').disabled = false;
};
boot();
</script>
