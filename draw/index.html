<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<title>我畫你猜</title>
<style>
:root{
  --bg:#FFF3EA; --ink:#4A2A1C; --muted:#9A7462; --line:#F6D9C6; --panel:#fff;
  --accent:#FF7A45; --accent-d:#E05A25; --ok:#21B573; --bad:#FF5E6C;
  --p0:#FF5E6C; --p1:#3D8BFF; --p2:#F2A100; --p3:#22A57E;
  --a0:#B15CFF; --a1:#FF5FA2; --a2:#14A9C4;
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-touch-callout:none;}
body{background:radial-gradient(circle at 12% 16%, #FFE2CF 0 130px, transparent 131px),radial-gradient(circle at 88% 86%, #E3F1FF 0 170px, transparent 171px),var(--bg);}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;}
.screen{position:fixed;inset:0;display:none;}
.screen.on{display:flex;}
.title{font-size:clamp(34px,6vh,64px);font-weight:900;letter-spacing:.06em;margin:.2em 0 .1em;color:var(--accent);text-shadow:0 4px 0 #FFD3BD;}
.title span{display:inline-block;animation:bob 2.4s ease-in-out infinite;}
.title span:nth-child(2n){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.panel{background:var(--panel);border-radius:24px;padding:20px 22px;box-shadow:0 6px 0 var(--line);}
.panel h2{margin:0 0 14px;font-size:22px;}
.panel h2 small{font-size:14px;color:var(--muted);font-weight:600;}
.seg{display:flex;gap:10px;flex-wrap:wrap;}
.seg button{min-width:64px;height:56px;padding:0 18px;border-radius:16px;background:#FFF1E8;font-size:21px;font-weight:800;box-shadow:0 4px 0 var(--line);}
.seg button.sel{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-d);}
.bigbtn{height:78px;padding:0 54px;border-radius:40px;background:var(--accent);color:#fff;font-size:34px;font-weight:900;letter-spacing:.1em;box-shadow:0 7px 0 var(--accent-d);}
.bigbtn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--accent-d);}
.btn2{height:78px;padding:0 26px;border-radius:40px;background:#fff;font-size:22px;font-weight:800;box-shadow:0 7px 0 var(--line);}
.btn2:active{transform:translateY(5px);box-shadow:0 2px 0 var(--line);}

#home{flex-direction:column;align-items:center;overflow:auto;padding:max(16px,2.5vh) 16px 24px;}
.subtitle{color:var(--muted);font-size:clamp(15px,2.2vh,20px);margin-bottom:max(12px,2vh);text-align:center;line-height:1.5;}
.home-grid{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:20px;width:min(1500px,100%);align-items:start;}
@media (max-width:1300px){.home-grid{grid-template-columns:1fr 1fr}.home-grid .panel:last-child{grid-column:1/-1}}
@media (orientation:portrait),(max-width:820px){.home-grid{grid-template-columns:1fr}}
.players{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
.prow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:18px;background:#FFF8F3;border:3px solid var(--pc);}
.avatar{width:62px;height:62px;border-radius:50%;background:var(--pc);font-size:38px;display:grid;place-items:center;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.12);}
.prow input{flex:1;min-width:0;height:52px;border-radius:14px;border:2px solid var(--line);font:inherit;font-size:24px;font-weight:700;padding:0 14px;color:var(--ink);background:#fff;}
.setting{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.setting label{font-size:18px;font-weight:800;}
.setting label small{color:var(--muted);font-weight:500;font-size:14px;}
.note{margin-top:14px;padding:12px 14px;border-radius:14px;background:#FFF7DE;color:#7A5A00;font-size:16px;font-weight:700;line-height:1.5;}
.startbar{display:flex;gap:14px;justify-content:center;margin-top:22px;flex-wrap:wrap;}

/* 上方列 */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 14px 4px;flex:none;}
.scores{flex:1;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.chip{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;background:#fff;border:4px solid var(--pc);box-shadow:0 4px 0 var(--line);}
.chip .av{width:clamp(36px,5.4vh,54px);height:clamp(36px,5.4vh,54px);border-radius:50%;background:var(--pc);display:grid;place-items:center;font-size:clamp(22px,3.2vh,34px);}
.chip .nm{font-size:clamp(15px,2.2vh,22px);font-weight:800;white-space:nowrap;max-width:14vw;overflow:hidden;text-overflow:ellipsis;}
.chip .sc{font-size:clamp(20px,3.2vh,32px);font-weight:900;color:var(--pc);min-width:1.1em;text-align:center;}
.chip.artist{border-style:dashed;}
.chip.bump{animation:bump .6s;}
@keyframes bump{40%{transform:scale(1.25)}}
.status{display:flex;align-items:center;gap:10px;flex:none;}
.badge{font-size:clamp(18px,2.8vh,28px);font-weight:900;background:#fff;padding:6px 16px;border-radius:14px;box-shadow:0 4px 0 var(--line);white-space:nowrap;}
.badge.warn{color:#fff;background:var(--bad);}
.icon{width:clamp(44px,6vh,60px);height:clamp(44px,6vh,60px);border-radius:16px;background:#fff;font-size:clamp(22px,3.2vh,30px);box-shadow:0 4px 0 var(--line);}
.msg{text-align:center;font-size:clamp(24px,4.2vh,44px);font-weight:900;min-height:1.4em;margin:2px 0 4px;flex:none;}
.who{display:inline-flex;align-items:center;gap:8px;color:var(--pc);}

/* 看題目 */
#view{flex-direction:column;align-items:center;justify-content:center;gap:max(14px,2vh);padding:16px;}
.viewTop{font-size:clamp(24px,4vh,40px);font-weight:900;text-align:center;}
.viewTop .who{font-size:1.1em;}
.peekcard{position:relative;width:min(56vh,80vw);height:min(56vh,80vw);border-radius:40px;background:#fff;box-shadow:0 10px 0 var(--line);display:grid;place-items:center;}
.peekcard .em{font-size:min(36vh,52vw);line-height:1;}
.peekcard svg{position:absolute;inset:-14px;width:calc(100% + 28px);height:calc(100% + 28px);pointer-events:none;}
.peekcard .sec{position:absolute;right:-18px;top:-18px;width:76px;height:76px;border-radius:50%;background:var(--accent);color:#fff;font-size:40px;font-weight:900;display:grid;place-items:center;box-shadow:0 5px 0 var(--accent-d);}
.viewName{font-size:clamp(30px,5vh,52px);font-weight:900;letter-spacing:.2em;}
.viewBtns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}

/* 畫圖 */
#draw,#guess{flex-direction:column;}
#padWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 12px;}
#pad{background:#fff;border-radius:22px;box-shadow:0 8px 0 var(--line),0 0 0 6px #fff;touch-action:none;cursor:crosshair;display:block;}
.tools{flex:none;display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.2vw,16px);padding:8px 12px max(12px,env(safe-area-inset-bottom));flex-wrap:wrap;}
.colors{display:flex;gap:clamp(6px,.8vw,10px);flex-wrap:wrap;justify-content:center;}
.colors button{width:clamp(44px,6.4vh,64px);height:clamp(44px,6.4vh,64px);border-radius:50%;background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.15),inset 0 0 0 3px rgba(255,255,255,.6);transition:transform .15s;}
.colors button.sel{transform:scale(1.18);box-shadow:0 0 0 5px #fff,0 0 0 9px var(--ink);}
.sizes{display:flex;gap:6px;background:#fff;padding:6px;border-radius:18px;box-shadow:0 4px 0 var(--line);}
.sizes button{width:clamp(44px,6vh,58px);height:clamp(44px,6vh,58px);border-radius:12px;display:grid;place-items:center;}
.sizes button i{display:block;border-radius:50%;background:var(--ink);}
.sizes button.sel{background:#FFE6D8;}
.tbtn{height:clamp(48px,6.6vh,66px);padding:0 16px;border-radius:18px;background:#fff;font-size:clamp(18px,2.6vh,24px);font-weight:800;box-shadow:0 4px 0 var(--line);white-space:nowrap;}
.tbtn.sel{background:#FFE6D8;box-shadow:0 0 0 4px var(--accent);}
.tbtn.done{background:var(--ok);color:#fff;box-shadow:0 5px 0 #168A57;font-size:clamp(20px,3vh,30px);padding:0 26px;}

/* 猜猜看 */
#guessWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 12px;}
#guessImg{max-width:100%;max-height:100%;border-radius:22px;background:#fff;box-shadow:0 8px 0 var(--line),0 0 0 6px #fff;}
.hintbar{flex:none;text-align:center;font-size:clamp(22px,3.6vh,36px);font-weight:900;min-height:1.3em;color:var(--accent-d);}
.hintbar .hbox{display:inline-block;width:1.4em;height:1.4em;border:4px dashed var(--accent);border-radius:10px;margin:0 4px;vertical-align:middle;}
.guessBtns{flex:none;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:8px 12px max(14px,env(safe-area-inset-bottom));}
.gbtn{height:clamp(60px,8.4vh,84px);padding:0 22px 0 10px;border-radius:999px;background:var(--pc);color:#fff;font-size:clamp(20px,3vh,30px);font-weight:900;display:flex;align-items:center;gap:10px;box-shadow:0 6px 0 rgba(0,0,0,.2);}
.gbtn .av{width:clamp(44px,6.2vh,62px);height:clamp(44px,6.2vh,62px);border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;font-size:clamp(26px,3.8vh,40px);}
.gbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2);}

/* 對照 */
#reveal{flex-direction:column;align-items:center;justify-content:center;gap:max(10px,1.6vh);padding:14px;}
.answer{font-size:clamp(30px,5.4vh,58px);font-weight:900;text-align:center;}
.answer .res{display:block;font-size:.55em;color:var(--muted);margin-top:4px;}
.pair{display:flex;gap:clamp(14px,2.4vw,36px);align-items:center;justify-content:center;width:100%;flex:1;min-height:0;}
@media (orientation:portrait){.pair{flex-direction:column}}
.pcard{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:0;max-height:100%;}
.pcard .lb{font-size:clamp(18px,2.8vh,28px);font-weight:900;color:var(--muted);}
.pcard .orig{width:var(--ps);height:var(--ps);border-radius:30px;background:#fff;box-shadow:0 8px 0 var(--line);display:grid;place-items:center;font-size:calc(var(--ps)*.66);line-height:1;}
.pcard img{height:var(--ps);border-radius:24px;background:#fff;box-shadow:0 8px 0 var(--line);}
.vs{font-size:clamp(34px,6vh,64px);}
.revBtns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;flex:none;}

/* 彈出視窗 */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50;}
.overlay.on{display:flex;}
.modal{background:rgba(70,35,20,.5);}
.box{background:#fff;border-radius:30px;padding:30px 36px;min-width:min(520px,90vw);max-width:94vw;max-height:94vh;overflow:auto;text-align:center;box-shadow:0 10px 0 var(--line);}
.box h2{font-size:clamp(30px,5vh,46px);margin:0 0 14px;}
.col{display:flex;flex-direction:column;gap:14px;align-items:center;}
.col .bigbtn,.col .btn2{width:min(380px,80vw);}
.readyAv{width:120px;height:120px;border-radius:50%;background:var(--pc);display:grid;place-items:center;font-size:76px;margin:0 auto 12px;}
.readyNm{font-size:clamp(32px,5.5vh,52px);font-weight:900;color:var(--pc);margin-bottom:6px;}
.meta{font-size:22px;color:var(--muted);font-weight:700;margin-bottom:18px;line-height:1.6}
.meta b{color:var(--ink);font-size:1.15em;}
.endWrap{display:grid;grid-template-columns:minmax(300px,420px) minmax(300px,1fr);gap:26px;text-align:left;}
@media (orientation:portrait),(max-width:900px){.endWrap{grid-template-columns:1fr}}
.rank{display:flex;flex-direction:column;gap:10px;margin:6px 0 16px;}
.rrow{display:flex;align-items:center;gap:12px;padding:8px 16px;border-radius:20px;background:#FFF8F3;border:4px solid var(--pc);}
.rrow .md{font-size:36px;width:46px;text-align:center}
.rrow .av{width:52px;height:52px;border-radius:50%;background:var(--pc);display:grid;place-items:center;font-size:32px}
.rrow .nm{flex:1;text-align:left;font-size:26px;font-weight:900}
.rrow .sc{font-size:28px;font-weight:900;color:var(--pc);white-space:nowrap}
.rrow.first{background:#FFF6D6}
.rrow.artist{border-style:dashed;}
.sub{font-size:20px;font-weight:900;margin:4px 0 8px;}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.gallery button{position:relative;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 4px 0 var(--line);border:3px solid var(--line);aspect-ratio:4/3;}
.gallery img{width:100%;height:100%;object-fit:contain;display:block;}
.gallery .tag{position:absolute;left:6px;top:4px;font-size:30px;}
.gallery .ok{position:absolute;right:6px;bottom:4px;font-size:22px;}
#viewer{background:rgba(70,35,20,.85);flex-direction:column;gap:14px;padding:16px;}
#viewer img{max-width:94vw;max-height:80vh;border-radius:18px;background:#fff;-webkit-touch-callout:default;}
#viewer .tip{color:#fff;font-size:18px;font-weight:700;}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;}
</style>
</head>
<body>

<section id="home" class="screen">
  <div class="title"><span>我</span><span>畫</span><span>你</span><span>猜</span></div>
  <div class="subtitle">小畫家先偷偷看題目，記住後畫出來；爸爸媽媽來猜，猜對就得分！<br>最後把題目和小畫家的畫放在一起比比看 🎨</div>
  <div class="home-grid">
    <div class="panel">
      <h2>🎨 小畫家 <small>（輪流畫）</small></h2>
      <div class="seg" id="segArtists"></div>
      <div class="players" id="artistRows"></div>
    </div>
    <div class="panel">
      <h2>🙋 猜的人 <small>（一隊一隊，或每人一隊）</small></h2>
      <div class="seg" id="segTeams"></div>
      <div class="players" id="teamRows"></div>
    </div>
    <div class="panel">
      <div class="setting"><label>👀 看題目幾秒</label><div class="seg" id="segLook"></div></div>
      <div class="setting"><label>🧩 題目難度 <small>簡單：蘋果、太陽…　普通：小狗、汽車…</small></label><div class="seg" id="segLevel"></div></div>
      <div class="setting"><label>🔢 玩幾題</label><div class="seg" id="segRounds"></div></div>
      <div class="setting"><label>⏱️ 畫畫時間</label><div class="seg" id="segDrawTime"></div></div>
      <div class="setting" style="margin-bottom:0"><label>🔊 音效</label><div class="seg" id="segSound"></div></div>
      <div class="note" id="note"></div>
    </div>
  </div>
  <div class="startbar">
    <button class="btn2" onclick="location.href='../'">🏠 遊戲選單</button>
    <button class="btn2" id="fsBtn">⛶ 全螢幕</button>
    <button class="bigbtn" id="startBtn">開始玩！</button>
  </div>
</section>

<section id="view" class="screen">
  <div class="viewTop" id="viewTop"></div>
  <div class="peekcard"><div class="em" id="viewEm"></div>
    <svg viewBox="0 0 100 100"><rect x="2" y="2" width="96" height="96" rx="12" fill="none" stroke="#FFD3BD" stroke-width="2.5"/><rect id="ring" x="2" y="2" width="96" height="96" rx="12" fill="none" stroke="var(--accent)" stroke-width="2.5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" stroke-linecap="round"/></svg>
    <div class="sec" id="viewSec"></div></div>
  <div class="viewName" id="viewName"></div>
  <div class="viewBtns">
    <button class="btn2" id="swapBtn">🔄 換一題</button>
    <button class="bigbtn" id="gotItBtn">記住了！</button>
  </div>
</section>

<section id="draw" class="screen">
  <div class="topbar">
    <div class="scores" id="drawWho"></div>
    <div class="status">
      <div class="badge" id="drawRound"></div>
      <div class="badge" id="drawTimer" hidden></div>
      <button class="icon" id="muteBtn">🔊</button>
      <button class="icon" id="pauseBtn">⏸️</button>
    </div>
  </div>
  <div id="padWrap"><canvas id="pad"></canvas></div>
  <div class="tools">
    <div class="colors" id="colors"></div>
    <div class="sizes" id="sizes"></div>
    <button class="tbtn" id="eraserBtn">🧽 擦</button>
    <button class="tbtn" id="undoBtn">↩️ 回上一步</button>
    <button class="tbtn" id="clearBtn">🗑️ 重畫</button>
    <button class="tbtn done" id="doneBtn">✅ 畫好了！</button>
  </div>
</section>

<section id="guess" class="screen">
  <div class="topbar">
    <div class="scores" id="scores"></div>
    <div class="status">
      <div class="badge" id="guessRound"></div>
      <button class="icon" id="muteBtn2">🔊</button>
      <button class="icon" id="pauseBtn2">⏸️</button>
    </div>
  </div>
  <div class="msg" id="guessMsg">🤔 猜猜看，畫的是什麼？</div>
  <div id="guessWrap"><img id="guessImg" alt=""></div>
  <div class="hintbar" id="hintbar"></div>
  <div class="guessBtns" id="guessBtns"></div>
</section>

<section id="reveal" class="screen">
  <div class="answer" id="answer"></div>
  <div class="pair" id="pair">
    <div class="pcard"><div class="lb">題目</div><div class="orig" id="revOrig"></div></div>
    <div class="vs">➡️</div>
    <div class="pcard"><div class="lb" id="revLb">小畫家畫的</div><img id="revImg" alt=""></div>
  </div>
  <div class="revBtns">
    <button class="btn2" id="saveOneBtn">💾 存這張</button>
    <button class="bigbtn" id="nextBtn">下一題</button>
  </div>
</section>

<div class="overlay modal" id="ready"><div class="box" id="readyBox">
  <div class="readyAv" id="readyAv"></div>
  <div class="readyNm" id="readyNm"></div>
  <div class="meta">🙈 猜的人請<b>閉上眼睛</b>或<b>轉過去</b>！<br>小畫家準備好了再按下面的按鈕看題目</div>
  <div class="col"><button class="bigbtn" id="lookBtn">👀 看題目</button></div>
</div></div>
<div class="overlay modal" id="turnBack"><div class="box">
  <h2>🎨 開始畫囉！</h2>
  <div class="meta">題目藏起來了，<b>猜的人可以張開眼睛</b>囉！<br>（看小畫家畫畫也可以邊看邊猜喔）</div>
  <div class="col"><button class="bigbtn" id="startDrawBtn">開始畫！</button></div>
</div></div>
<div class="overlay modal" id="pauseModal"><div class="box">
  <h2>暫停一下</h2>
  <div class="col">
    <button class="bigbtn" id="resumeBtn">繼續玩</button>
    <button class="btn2" id="skipBtn">⏭️ 這題跳過</button>
    <button class="btn2" id="finishBtn">🏁 結束，看成績</button>
    <button class="btn2" id="homeBtn">🏠 回首頁</button>
  </div>
</div></div>
<div class="overlay modal" id="confirmClear"><div class="box">
  <h2>全部擦掉重畫？</h2>
  <div class="col">
    <button class="bigbtn" id="clearYes">🗑️ 擦掉</button>
    <button class="btn2" id="clearNo">不要</button>
  </div>
</div></div>
<div class="overlay modal" id="endModal"><div class="box" style="width:min(1300px,94vw)">
  <h2 id="endTitle"></h2>
  <div class="endWrap">
    <div><div class="rank" id="rank"></div><div class="meta" id="endMeta" style="margin-bottom:0"></div></div>
    <div><div class="sub">🖼️ 今天的畫 <small style="color:var(--muted);font-size:15px">點一下放大，可以存起來</small></div><div class="gallery" id="gallery"></div></div>
  </div>
  <div class="col" style="margin-top:20px">
    <button class="bigbtn" id="againBtn">再玩一次</button>
    <button class="btn2" id="endHomeBtn">🏠 回首頁</button>
  </div>
</div></div>
<div class="overlay" id="viewer"><img id="viewerImg" alt=""><div class="tip" id="viewerTip">在圖片上長按，可以「加入照片」存到 iPad　·　點旁邊關閉</div></div>
<canvas id="confetti"></canvas>

<script>
const $ = id => document.getElementById(id);
const TEAM_COLORS = ['var(--p0)','var(--p1)','var(--p2)','var(--p3)'];
const ARTIST_COLORS = ['var(--a0)','var(--a1)','var(--a2)'];
const ANIMALS = ['🐰','🐻','🐱','🐶','🐼','🦊','🐯','🐸','🐧','🦁','🐵','🐨','🐷','🐮','🦄','🐥'];
const DEFAULT_NAMES = ['玩家1','玩家2','玩家3','玩家4'];
const ARTIST_DEFAULT = [{name:'小畫家1', emoji:'🦄'}, {name:'小畫家2', emoji:'🐥'}, {name:'小畫家3', emoji:'🐨'}];
const CATS = { food:'🍽️ 是吃的', animal:'🐾 是動物', ride:'🚗 是交通工具', thing:'🧸 是東西', nature:'🌳 大自然裡的' };
/* [圖, 名字, 分類, 難度 1=簡單 2=普通] */
const ITEMS = [
  ['🍎','蘋果','food',1],['🍌','香蕉','food',1],['🍉','西瓜','food',1],['🍓','草莓','food',1],['🍇','葡萄','food',1],['🍦','冰淇淋','food',1],
  ['🍩','甜甜圈','food',1],['🍭','棒棒糖','food',1],['🍬','糖果','food',1],['🥚','雞蛋','food',1],['🧁','杯子蛋糕','food',1],['🍄','香菇','food',1],
  ['🥕','紅蘿蔔','food',1],['🍒','櫻桃','food',1],['🍐','梨子','food',1],['🍊','橘子','food',1],
  ['☀️','太陽','nature',1],['🌙','月亮','nature',1],['⭐','星星','nature',1],['☁️','雲','nature',1],['🌈','彩虹','nature',1],['🌷','花','nature',1],
  ['🌳','樹','nature',1],['💧','水滴','nature',1],['🔥','火','nature',1],['⛄','雪人','nature',1],['❄️','雪花','nature',2],['⚡','閃電','nature',1],['🍁','葉子','nature',1],
  ['❤️','愛心','thing',1],['🎈','氣球','thing',1],['☂️','雨傘','thing',1],['⚽','足球','thing',1],['🏠','房子','thing',1],['👓','眼鏡','thing',1],
  ['🧦','襪子','thing',1],['🔑','鑰匙','thing',1],['✏️','鉛筆','thing',1],['🔔','鈴鐺','thing',1],['📖','書','thing',1],['🎁','禮物','thing',1],
  ['🐟','魚','animal',1],['🐌','蝸牛','animal',1],['🐛','毛毛蟲','animal',1],['🐍','蛇','animal',1],
  ['🍔','漢堡','food',2],['🍕','披薩','food',2],['🎂','生日蛋糕','food',2],['🌽','玉米','food',2],['🍙','飯糰','food',2],['🍗','雞腿','food',2],
  ['🐱','貓咪','animal',2],['🐶','小狗','animal',2],['🐰','兔子','animal',2],['🐷','豬','animal',2],['🐥','小雞','animal',2],['🐢','烏龜','animal',2],
  ['🦋','蝴蝶','animal',2],['🐞','瓢蟲','animal',2],['🐙','章魚','animal',2],['🦀','螃蟹','animal',2],['🐳','鯨魚','animal',2],['🐘','大象','animal',2],
  ['🦒','長頸鹿','animal',2],['🦁','獅子','animal',2],['🐧','企鵝','animal',2],['🐸','青蛙','animal',2],['🐝','蜜蜂','animal',2],['🦕','恐龍','animal',2],
  ['🐭','老鼠','animal',2],['🐮','牛','animal',2],
  ['🚗','汽車','ride',2],['🚌','公車','ride',2],['🚂','火車','ride',2],['✈️','飛機','ride',2],['⛵','帆船','ride',2],['🚲','腳踏車','ride',2],['🚀','火箭','ride',2],
  ['🚁','直升機','ride',2],['🚒','消防車','ride',2],
  ['⏰','鬧鐘','thing',2],['📺','電視','thing',2],['📱','手機','thing',2],['✂️','剪刀','thing',2],['🪥','牙刷','thing',2],['👑','皇冠','thing',2],
  ['🎸','吉他','thing',2],['🥁','鼓','thing',2],['🏰','城堡','thing',2],['⛺','帳篷','thing',2],['🧢','帽子','thing',2],['👕','衣服','thing',2],['🪁','風箏','thing',2],
  ['🎀','蝴蝶結','thing',2],
];
const PEN_COLORS = ['#222222','#FF4040','#FF9F1C','#FFD60A','#2DC653','#3A86FF','#8E44EC','#FF77B7','#8B5A2B'];
const PEN_SIZES = [8, 18, 34];
const W = 1200, H = 900;   // 畫布的「紙張」大小（不管螢幕多大，存下來都是這個大小）

let settings = { artists: 1, teams: 2, look: 10, level: 1, rounds: 5, drawTime: 0, sound: true };
let artistList = ARTIST_DEFAULT.map(a => ({...a}));
let players = [0,1,2,3].map(i => ({name: DEFAULT_NAMES[i], emoji: ANIMALS[i]}));
try { const s = JSON.parse(localStorage.getItem('drawgame-settings') || '{}'); if (s.artistList) { artistList = s.artistList; delete s.artistList; } Object.assign(settings, s); } catch(e) {}
try { const f = JSON.parse(localStorage.getItem('flipgame-settings') || 'null'); if (f && f.players) players = f.players; } catch(e) {}
function save(){ try {
  localStorage.setItem('drawgame-settings', JSON.stringify({...settings, artistList}));
  const f = JSON.parse(localStorage.getItem('flipgame-settings') || '{}'); f.players = players; localStorage.setItem('flipgame-settings', JSON.stringify(f));
} catch(e) {} }
function recentItems(){ try { return JSON.parse(localStorage.getItem('drawgame-recent') || '[]'); } catch(e) { return []; } }
function addRecent(name){ const r = recentItems().filter(x => x !== name); r.unshift(name); try { localStorage.setItem('drawgame-recent', JSON.stringify(r.slice(0, 40))); } catch(e) {} }

/* 音效 */
let actx = null;
function audio(){ if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
function tone(f, d, {type='sine', vol=.18, at=0, slide=0} = {}){
  if (!settings.sound) return; const a = audio(); if (!a) return;
  const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .05);
}
const SFX = {
  pick(){ tone(700, .07, {type:'triangle', vol:.13}); },
  tick(){ tone(880, .06, {type:'square', vol:.05}); },
  hide(){ tone(660, .15, {type:'triangle', slide:330, vol:.14}); },
  ok(){ [784,988,1175,1568].forEach((f,i) => tone(f, .18, {type:'triangle', at:i*.08})); },
  miss(){ tone(400, .2, {vol:.12, slide:300}); tone(300, .3, {vol:.1, at:.18}); },
  hint(){ tone(1046, .12, {type:'sine', vol:.12}); tone(1318, .2, {type:'sine', vol:.12, at:.1}); },
  win(){ [523,523,523,659,587,659,784,1047].forEach((f,i) => tone(f, .26, {type:'triangle', at:[0,.15,.3,.45,.75,.9,1.05,1.3][i], vol:.2})); }
};

/* 首頁 */
function seg(el, opts, cur, pick){ el.innerHTML = '';
  opts.forEach(([v, l]) => { const b = document.createElement('button'); b.textContent = l; if (v === cur) b.classList.add('sel'); b.onclick = () => { audio(); SFX.pick(); pick(v); }; el.appendChild(b); }); }
function personRows(box, list, n, colors){
  box.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const p = list[i], r = document.createElement('div'); r.className = 'prow'; r.style.setProperty('--pc', colors[i]);
    r.innerHTML = `<button class="avatar">${p.emoji}</button><input maxlength="6">`;
    r.querySelector('input').value = p.name;
    r.querySelector('.avatar').onclick = e => { audio(); SFX.pick(); const used = list.slice(0, n).map(x => x.emoji); let k = ANIMALS.indexOf(p.emoji);
      do { k = (k + 1) % ANIMALS.length; } while (used.includes(ANIMALS[k]) && ANIMALS[k] !== p.emoji); p.emoji = ANIMALS[k]; e.currentTarget.textContent = p.emoji; save(); };
    r.querySelector('input').oninput = e => { p.name = e.target.value; save(); };
    box.appendChild(r);
  }
}
function renderHome(){
  seg($('segArtists'), [[1,'1 人'],[2,'2 人'],[3,'3 人']], settings.artists, v => { settings.artists = v; save(); renderHome(); });
  personRows($('artistRows'), artistList, settings.artists, ARTIST_COLORS);
  seg($('segTeams'), [[1,'1 隊'],[2,'2 隊'],[3,'3 隊'],[4,'4 隊']], settings.teams, v => { settings.teams = v; save(); renderHome(); });
  personRows($('teamRows'), players, settings.teams, TEAM_COLORS);
  seg($('segLook'), [[5,'5 秒'],[10,'10 秒'],[15,'15 秒']], settings.look, v => { settings.look = v; save(); renderHome(); });
  seg($('segLevel'), [[1,'簡單'],[2,'普通'],[0,'混合']], settings.level, v => { settings.level = v; save(); renderHome(); });
  seg($('segRounds'), [[5,'5 題'],[8,'8 題'],[10,'10 題']], settings.rounds, v => { settings.rounds = v; save(); renderHome(); });
  seg($('segDrawTime'), [[0,'不限時'],[60,'1 分鐘'],[120,'2 分鐘']], settings.drawTime, v => { settings.drawTime = v; save(); renderHome(); });
  seg($('segSound'), [[true,'開'],[false,'關']], settings.sound, v => { settings.sound = v; save(); renderHome(); });
  $('note').innerHTML = settings.teams === 1
    ? '大家一起猜，看看全家能猜對幾題！小畫家的畫被猜到，就得一顆 ⭐'
    : '哪一隊先說出答案，就按那一隊。<b>沒看提示</b>猜對得 2 分，看了提示得 1 分；小畫家的畫被猜到，就得一顆 ⭐';
}
const fsEl = document.documentElement;
if (!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen)) $('fsBtn').hidden = true;
$('fsBtn').onclick = () => { try { if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl); } catch(e) {} };

/* 遊戲流程：準備 → 看題目 → 畫 → 猜 → 對照 */
const sleep = ms => new Promise(r => setTimeout(r, ms));
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
function closeAll(){ document.querySelectorAll('.overlay').forEach(o => o.classList.remove('on')); }
let G = null;

function startGame(){
  audio();
  const teams = players.slice(0, settings.teams).map((p, i) => ({name: (p.name || '').trim() || DEFAULT_NAMES[i], emoji: p.emoji, color: TEAM_COLORS[i], score: 0, hits: 0}));
  const artists = artistList.slice(0, settings.artists).map((p, i) => ({name: (p.name || '').trim() || ARTIST_DEFAULT[i].name, emoji: p.emoji, color: ARTIST_COLORS[i], stars: 0}));
  const recent = recentItems(), pool = ITEMS.filter(x => !settings.level || x[3] === settings.level);
  const fresh = shuffle(pool.filter(x => !recent.includes(x[1]))), old = shuffle(pool.filter(x => recent.includes(x[1])));
  G = { teams, artists, queue: fresh.concat(old), round: 0, item: null, results: [], token: {}, paused: false };
  ['muteBtn','muteBtn2'].forEach(id => $(id).textContent = settings.sound ? '🔊' : '🔇');
  nextRound();
}
const artistNow = () => G.artists[G.round % G.artists.length];
function nextRound(){
  if (G.round >= settings.rounds) return endGame();
  G.token = {}; G.item = G.queue.shift() || ITEMS[Math.floor(Math.random() * ITEMS.length)]; G.hint = false;
  const a = artistNow();
  $('readyBox').style.setProperty('--pc', a.color); $('readyAv').textContent = a.emoji; $('readyNm').textContent = `第 ${G.round + 1} 題：${a.name} 畫`;
  show(''); closeAll(); $('ready').classList.add('on');
}
$('lookBtn').onclick = () => { audio(); SFX.pick(); $('ready').classList.remove('on'); startView(); };

/* 看題目（倒數） */
async function startView(){
  const a = artistNow(), token = G.token = {};
  $('viewTop').innerHTML = `<span class="who" style="--pc:${a.color}">${a.emoji} <span></span></span>，仔細看，記起來喔！`;
  $('viewTop').querySelector('.who span').textContent = a.name;
  $('viewEm').textContent = G.item[0]; $('viewName').textContent = G.item[1];
  show('view');
  const total = settings.look * 1000, t0 = performance.now(); let lastSec = -1;
  while (true) {
    await sleep(100); if (token !== G.token) return;
    if (G.paused) continue;
    const left = Math.max(0, total - (performance.now() - t0)), sec = Math.ceil(left / 1000);
    $('ring').style.strokeDashoffset = 100 - left / total * 100; $('viewSec').textContent = sec;
    if (sec !== lastSec && sec <= 3 && sec > 0) SFX.tick(); lastSec = sec;
    if (!left) break;
  }
  hideItem();
}
function hideItem(){ G.token = {}; SFX.hide(); addRecent(G.item[1]); $('turnBack').classList.add('on'); }
$('gotItBtn').onclick = () => { audio(); SFX.pick(); hideItem(); };
$('swapBtn').onclick = () => { audio(); SFX.pick(); G.queue.push(G.item); G.item = G.queue.shift(); startView(); };
$('startDrawBtn').onclick = () => { audio(); SFX.pick(); $('turnBack').classList.remove('on'); startDraw(); };

/* 畫畫 */
const pad = $('pad'), ctx = pad.getContext('2d');
let strokes = [], cur = null, pen = { color: PEN_COLORS[0], size: 1, eraser: false }, scale = 1;
function buildTools(){
  const cb = $('colors'); cb.innerHTML = '';
  PEN_COLORS.forEach(c => { const b = document.createElement('button'); b.style.setProperty('--c', c);
    b.onclick = () => { SFX.pick(); pen.color = c; pen.eraser = false; syncTools(); }; cb.appendChild(b); });
  const sb = $('sizes'); sb.innerHTML = '';
  PEN_SIZES.forEach((s, i) => { const b = document.createElement('button'); const d = [10, 18, 28][i]; b.innerHTML = `<i style="width:${d}px;height:${d}px"></i>`;
    b.onclick = () => { SFX.pick(); pen.size = i; syncTools(); }; sb.appendChild(b); });
  syncTools();
}
function syncTools(){
  [...$('colors').children].forEach((b, i) => b.classList.toggle('sel', !pen.eraser && PEN_COLORS[i] === pen.color));
  [...$('sizes').children].forEach((b, i) => b.classList.toggle('sel', i === pen.size));
  $('eraserBtn').classList.toggle('sel', pen.eraser);
}
$('eraserBtn').onclick = () => { SFX.pick(); pen.eraser = !pen.eraser; syncTools(); };
function fitPad(){
  const wrap = $('padWrap'), aw = wrap.clientWidth - 24, ah = wrap.clientHeight - 16;
  if (aw <= 0 || ah <= 0) return;
  const cw = Math.floor(Math.min(aw, ah * W / H)), ch = Math.floor(cw * H / W), dpr = Math.min(2, devicePixelRatio || 1);
  pad.style.width = cw + 'px'; pad.style.height = ch + 'px'; pad.width = Math.round(cw * dpr); pad.height = Math.round(ch * dpr);
  scale = pad.width / W; redraw();
}
function paintStroke(g, s, k){
  g.save(); g.scale(k, k); g.lineCap = g.lineJoin = 'round'; g.strokeStyle = g.fillStyle = s.eraser ? '#fff' : s.color; g.lineWidth = s.w;
  const p = s.pts;
  if (p.length === 1) { g.beginPath(); g.arc(p[0][0], p[0][1], s.w / 2, 0, Math.PI * 2); g.fill(); }
  else { g.beginPath(); g.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length - 1; i++) { const mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2; g.quadraticCurveTo(p[i][0], p[i][1], mx, my); }
    g.lineTo(p[p.length - 1][0], p[p.length - 1][1]); g.stroke(); }
  g.restore();
}
function visible(){ const i = strokes.map(s => s.clear).lastIndexOf(true); return strokes.slice(i + 1); }
function renderTo(g, k){ g.fillStyle = '#fff'; g.fillRect(0, 0, W * k, H * k); visible().forEach(s => paintStroke(g, s, k)); if (cur) paintStroke(g, cur, k); }
function redraw(){ renderTo(ctx, scale); }
function toPaper(e){ const r = pad.getBoundingClientRect(); return [Math.max(0, Math.min(W, (e.clientX - r.left) / r.width * W)), Math.max(0, Math.min(H, (e.clientY - r.top) / r.height * H))]; }
let drawing = false, activeId = null;
pad.addEventListener('pointerdown', e => {
  if (!G || G.paused || activeId !== null) return; e.preventDefault();
  activeId = e.pointerId; try { pad.setPointerCapture(e.pointerId); } catch(_) {}
  cur = { color: pen.color, w: PEN_SIZES[pen.size] * (pen.eraser ? 1.8 : 1), eraser: pen.eraser, pts: [toPaper(e)] }; redraw();
});
pad.addEventListener('pointermove', e => {
  if (!cur || e.pointerId !== activeId) return; e.preventDefault();
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of evs) { const p = toPaper(ev), l = cur.pts[cur.pts.length - 1]; if (Math.hypot(p[0] - l[0], p[1] - l[1]) > 1.5) cur.pts.push(p); }
  redraw();
});
function endStroke(e){ if (!cur || e.pointerId !== activeId) return; strokes.push(cur); cur = null; activeId = null; redraw(); }
pad.addEventListener('pointerup', endStroke); pad.addEventListener('pointercancel', endStroke);
document.addEventListener('touchmove', e => { if (e.target === pad) e.preventDefault(); }, {passive: false});
$('undoBtn').onclick = () => { SFX.pick(); strokes.pop(); redraw(); };
$('clearBtn').onclick = () => { if (!visible().length) return; SFX.pick(); $('confirmClear').classList.add('on'); };
$('clearYes').onclick = () => { strokes.push({clear: true}); redraw(); $('confirmClear').classList.remove('on'); };
$('clearNo').onclick = () => $('confirmClear').classList.remove('on');
addEventListener('resize', () => { if ($('draw').classList.contains('on')) fitPad(); fitReveal(); });

async function startDraw(){
  strokes = []; cur = null; pen.eraser = false; syncTools();
  const a = artistNow(), token = G.token = {};
  $('drawWho').innerHTML = `<div class="chip artist" style="--pc:${a.color}"><div class="av">${a.emoji}</div><div class="nm"></div><div class="sc">⭐${a.stars}</div></div>`;
  $('drawWho').querySelector('.nm').textContent = `${a.name} 畫畫中…`;
  $('drawRound').textContent = `第 ${G.round + 1} / ${settings.rounds} 題`;
  show('draw'); fitPad();
  $('drawTimer').hidden = !settings.drawTime; $('drawTimer').classList.remove('warn');
  if (!settings.drawTime) return;
  let left = settings.drawTime * 1000, last = performance.now();
  while (left > 0) {
    await sleep(200); if (token !== G.token) return;
    const now = performance.now(); if (!G.paused) left -= now - last; last = now;
    const s = Math.max(0, Math.ceil(left / 1000)); $('drawTimer').textContent = `⏱️ ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    $('drawTimer').classList.toggle('warn', s <= 10); if (s <= 5 && s > 0 && Math.abs(left - s * 1000) < 200) SFX.tick();
  }
  finishDraw(true);
}
$('doneBtn').onclick = () => { audio(); if (!visible().length && !cur) { SFX.miss(); return; } finishDraw(false); };
function snapshot(){ const c = document.createElement('canvas'); c.width = W; c.height = H; renderTo(c.getContext('2d'), 1); return c.toDataURL('image/jpeg', .9); }
function finishDraw(timeUp){
  G.token = {}; if (cur) { strokes.push(cur); cur = null; activeId = null; }
  G.drawing = snapshot(); SFX.ok(); startGuess(timeUp);
}

/* 猜猜看 */
function renderScores(){
  const box = $('scores'); box.innerHTML = '';
  if (G.teams.length > 1) G.teams.forEach(t => { const c = document.createElement('div'); c.className = 'chip'; c.style.setProperty('--pc', t.color);
    c.innerHTML = `<div class="av">${t.emoji}</div><div class="nm"></div><div class="sc">${t.score}</div>`; c.querySelector('.nm').textContent = t.name; box.appendChild(c); });
  else { const t = G.teams[0], c = document.createElement('div'); c.className = 'chip'; c.style.setProperty('--pc', t.color);
    c.innerHTML = `<div class="av">${t.emoji}</div><div class="nm"></div><div class="sc">${t.hits}<small style="font-size:.5em"> 題</small></div>`; c.querySelector('.nm').textContent = t.name; box.appendChild(c); }
  G.artists.forEach(a => { const c = document.createElement('div'); c.className = 'chip artist'; c.style.setProperty('--pc', a.color);
    c.innerHTML = `<div class="av">${a.emoji}</div><div class="nm"></div><div class="sc">⭐${a.stars}</div>`; c.querySelector('.nm').textContent = a.name; box.appendChild(c); });
}
function startGuess(timeUp){
  $('guessImg').src = G.drawing; $('guessRound').textContent = `第 ${G.round + 1} / ${settings.rounds} 題`;
  $('guessMsg').textContent = timeUp ? '⏰ 時間到！猜猜看，畫的是什麼？' : '🤔 猜猜看，畫的是什麼？';
  $('hintbar').textContent = '';
  renderScores(); renderGuessBtns(); show('guess');
}
function renderGuessBtns(){
  const box = $('guessBtns'); box.innerHTML = ''; const pts = G.hint ? 1 : 2;
  G.teams.forEach((t, i) => { const b = document.createElement('button'); b.className = 'gbtn'; b.style.setProperty('--pc', t.color);
    b.innerHTML = `<span class="av">${t.emoji}</span><span></span>`;
    b.lastChild.textContent = G.teams.length > 1 ? `${t.name} 猜對 +${pts}` : '猜對了！';
    b.onclick = () => guessed(i); box.appendChild(b); });
  if (!G.hint) { const h = document.createElement('button'); h.className = 'btn2'; h.style.height = 'clamp(60px,8.4vh,84px)'; h.textContent = '💡 提示';
    h.onclick = () => { SFX.hint(); G.hint = true; $('hintbar').innerHTML = `${CATS[G.item[2]]}，有 ${'<span class="hbox"></span>'.repeat([...G.item[1]].length)} ${[...G.item[1]].length} 個字`; renderGuessBtns(); }; box.appendChild(h); }
  const n = document.createElement('button'); n.className = 'btn2'; n.style.height = 'clamp(60px,8.4vh,84px)'; n.textContent = '🤷 都猜不到';
  n.onclick = () => guessed(-1); box.appendChild(n);
}
function guessed(i){
  audio(); const a = artistNow(), r = { item: G.item, drawing: G.drawing, artist: a, team: i >= 0 ? G.teams[i] : null, pts: 0 };
  if (i >= 0) { const t = G.teams[i]; r.pts = G.hint ? 1 : 2; t.score += r.pts; t.hits++; a.stars++; SFX.ok(); confetti(1800); }
  else SFX.miss();
  G.results.push(r); showReveal(r);
}

/* 對照 */
function showReveal(r){
  $('answer').innerHTML = `答案是：${r.item[0]} <span></span>！<span class="res"></span>`;
  $('answer').children[0].textContent = r.item[1];
  $('answer').querySelector('.res').textContent = r.team ? (G.teams.length > 1 ? `🎉 ${r.team.name} 猜對了，+${r.pts} 分！${r.artist.name} 得到一顆 ⭐` : `🎉 猜對了！${r.artist.name} 得到一顆 ⭐`) : '😆 這題太難了，大家都沒猜到！';
  $('revOrig').textContent = r.item[0]; $('revImg').src = r.drawing; $('revLb').textContent = `${r.artist.name} 畫的`;
  G.round++; $('nextBtn').textContent = G.round >= settings.rounds ? '🏁 看成績' : '下一題 ➡️';
  show('reveal'); fitReveal();
}
function fitReveal(){
  if (!$('reveal').classList.contains('on')) return;
  const pair = $('pair'), portrait = innerHeight > innerWidth, h = pair.clientHeight - 50, w = pair.clientWidth;
  const ps = portrait ? Math.min((pair.clientHeight - 190) / 2, (w - 20) * H / W) : Math.min(h, (w - 120) / (1 + W / H));
  pair.style.setProperty('--ps', Math.max(120, Math.floor(ps)) + 'px');
}
$('nextBtn').onclick = () => { audio(); SFX.pick(); stopConfetti(); nextRound(); };
$('saveOneBtn').onclick = () => { const r = G.results[G.results.length - 1]; if (r) openViewer(r); };

/* 存圖：題目＋小朋友的畫拼成一張 */
function compose(r){
  const c = document.createElement('canvas'), cw = 2000, ch = 1080; c.width = cw; c.height = ch; const g = c.getContext('2d');
  g.fillStyle = '#FFF3EA'; g.fillRect(0, 0, cw, ch);
  const font = '"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif', emo = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  g.fillStyle = '#4A2A1C'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `900 64px ${font}`; g.fillText(`${r.item[1]}　—　${r.artist.name} 畫的`, cw / 2, 80);
  const rr = (x, y, w, h, rad) => { g.beginPath(); g.moveTo(x + rad, y); g.arcTo(x + w, y, x + w, y + h, rad); g.arcTo(x + w, y + h, x, y + h, rad); g.arcTo(x, y + h, x, y, rad); g.arcTo(x, y, x + w, y, rad); g.closePath(); };
  g.fillStyle = '#fff'; rr(60, 170, 700, 700, 50); g.fill();
  g.font = `480px ${emo}`; g.fillText(r.item[0], 410, 545);
  return new Promise(res => { const im = new Image(); im.onload = () => {
    g.save(); rr(820, 170, 1120, 840, 40); g.clip(); g.drawImage(im, 820, 170, 1120, 840); g.restore();
    g.font = `800 40px ${font}`; g.fillStyle = '#9A7462'; g.fillText('題目', 410, 930); g.fillText(new Date().toLocaleDateString('zh-TW'), 410, 990);
    res(c.toDataURL('image/jpeg', .9)); }; im.src = r.drawing; });
}
async function openViewer(r){ $('viewerImg').src = await compose(r); $('viewer').classList.add('on'); }
$('viewer').onclick = e => { if (e.target !== $('viewerImg')) $('viewer').classList.remove('on'); };

/* 暫停 */
function pause(){ if (!G) return; G.paused = true; $('pauseModal').classList.add('on'); }
$('pauseBtn').onclick = pause; $('pauseBtn2').onclick = pause;
$('resumeBtn').onclick = () => { G.paused = false; $('pauseModal').classList.remove('on'); };
$('skipBtn').onclick = () => { G.paused = false; $('pauseModal').classList.remove('on'); nextRound(); };
$('finishBtn').onclick = () => { G.paused = false; $('pauseModal').classList.remove('on'); G.token = {}; endGame(); };
$('homeBtn').onclick = () => goHome();
function mute(){ settings.sound = !settings.sound; save(); ['muteBtn','muteBtn2'].forEach(id => $(id).textContent = settings.sound ? '🔊' : '🔇'); }
$('muteBtn').onclick = mute; $('muteBtn2').onclick = mute;
function goHome(){ if (G) G.token = {}; G = null; closeAll(); stopConfetti(); renderHome(); show('home'); }

/* 成績 */
function endGame(){
  closeAll(); show('');
  const medals = ['🥇','🥈','🥉','🎖️']; let html = '';
  if (G.teams.length > 1) {
    const sorted = [...G.teams].sort((a, b) => b.score - a.score), top = sorted[0].score, winners = sorted.filter(t => t.score === top);
    $('endTitle').textContent = !top ? '🎨 畫得好棒！' : winners.length > 1 ? '🎉 平手！大家都好會猜！' : `🎉 ${winners[0].name} 最會猜！`;
    let rank = 0; sorted.forEach((t, i) => { if (i > 0 && t.score < sorted[i - 1].score) rank = i;
      html += `<div class="rrow${rank === 0 && top ? ' first' : ''}" style="--pc:${t.color}"><div class="md">${medals[rank]}</div><div class="av">${t.emoji}</div><div class="nm"></div><div class="sc">${t.score} 分</div></div>`; });
    G.artists.forEach(a => html += `<div class="rrow artist" style="--pc:${a.color}"><div class="md">🎨</div><div class="av">${a.emoji}</div><div class="nm"></div><div class="sc">⭐ ${a.stars}</div></div>`);
    $('rank').innerHTML = html; const names = sorted.map(t => t.name).concat(G.artists.map(a => a.name));
    $('rank').querySelectorAll('.nm').forEach((el, i) => el.textContent = names[i]);
  } else {
    const t = G.teams[0]; $('endTitle').textContent = '🎉 好棒的畫家們！';
    html = `<div class="rrow first" style="--pc:${t.color}"><div class="md">🙋</div><div class="av">${t.emoji}</div><div class="nm"></div><div class="sc">猜對 ${t.hits} 題</div></div>`;
    G.artists.forEach(a => html += `<div class="rrow artist" style="--pc:${a.color}"><div class="md">🎨</div><div class="av">${a.emoji}</div><div class="nm"></div><div class="sc">⭐ ${a.stars}</div></div>`);
    $('rank').innerHTML = html; const names = [t.name].concat(G.artists.map(a => a.name));
    $('rank').querySelectorAll('.nm').forEach((el, i) => el.textContent = names[i]);
  }
  const hit = G.results.filter(r => r.team).length;
  $('endMeta').innerHTML = `一共畫了 <b>${G.results.length}</b> 題，猜對 <b>${hit}</b> 題`;
  const gal = $('gallery'); gal.innerHTML = '';
  G.results.forEach(r => { const b = document.createElement('button'); b.innerHTML = `<img src="${r.drawing}" alt=""><span class="tag">${r.item[0]}</span><span class="ok">${r.team ? '✅' : '🤷'}</span>`;
    b.onclick = () => openViewer(r); gal.appendChild(b); });
  if (!G.results.length) gal.innerHTML = '<div class="meta">還沒有畫喔</div>';
  $('endModal').classList.add('on'); SFX.win(); confetti(4500);
}
$('againBtn').onclick = () => { $('endModal').classList.remove('on'); stopConfetti(); startGame(); };
$('endHomeBtn').onclick = () => goHome();
$('startBtn').onclick = startGame;

let confRAF = 0;
function confetti(ms){
  stopConfetti();
  const cv = $('confetti'), g = cv.getContext('2d'); cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; g.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  const cols = ['#FF5E6C','#3D8BFF','#FF7A45','#21B573','#FFC93C','#B15CFF'];
  const ps = Array.from({length:160}, () => ({x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*.6, vx:(Math.random()-.5)*3, vy:2+Math.random()*3, r:Math.random()*6, w:8+Math.random()*8, h:5+Math.random()*6, c:cols[Math.floor(Math.random()*cols.length)], s:(Math.random()-.5)*.3}));
  const t0 = performance.now();
  const step = t => { g.clearRect(0,0,innerWidth,innerHeight); ps.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.r+=p.s; g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle=p.c; g.fillRect(-p.w/2,-p.h/2,p.w,p.h); g.restore(); });
    if (t - t0 < ms) confRAF = requestAnimationFrame(step); else g.clearRect(0,0,innerWidth,innerHeight); };
  confRAF = requestAnimationFrame(step);
}
function stopConfetti(){ cancelAnimationFrame(confRAF); const cv = $('confetti'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); }

buildTools(); renderHome(); show('home');
</script>
</body>
