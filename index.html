<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>家庭小遊戲</title>
<style>
:root{--bg:#FFF6E9;--ink:#3B2A1A;--muted:#8A7258;--line:#F0DCC0;--accent:#FF7A45;
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:6vh 16px}
h1{font-size:clamp(36px,7vw,60px);color:var(--accent);margin:0 0 8px;text-shadow:0 4px 0 #FFD2B0;letter-spacing:.06em}
p{color:var(--muted);margin:0 0 32px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;width:min(900px,100%)}
a.game{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 20px;background:#fff;border-radius:28px;
  text-decoration:none;color:inherit;box-shadow:0 8px 0 var(--line);transition:transform .12s}
a.game:active{transform:translateY(5px);box-shadow:0 3px 0 var(--line)}
.ico{font-size:72px}
.nm{font-size:28px;font-weight:900}
.ds{font-size:16px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<h1>家庭小遊戲</h1>
<p>選一個來玩吧！</p>
<div class="grid">
  <a class="game" href="memory/"><div class="ico">🃏</div><div class="nm">全家翻翻樂</div><div class="ds">翻開兩張一樣的照片就得分，1–4 人輪流玩</div></a>
  <a class="game" href="match/"><div class="ico">✨</div><div class="nm">全家消消樂</div><div class="ds">找出兩張一樣的照片消掉，單人計時或多人限時比賽</div></a>
  <a class="game" href="who/"><div class="ico">🤔</div><div class="nm">這是誰？</div><div class="ds">看照片猜是哪個寶貝，全家一起猜</div></a>
  <a class="game" href="puzzle/"><div class="ico">🧩</div><div class="nm">照片拼圖</div><div class="ds">把碎片拖回原位，4 到 49 塊，還能好幾張混在一起拼</div></a>
  <a class="game" href="dots/"><div class="ico">✏️</div><div class="nm">點點連線</div><div class="ds">照數字把點連起來，看看會變出誰</div></a>
  <a class="game" href="color/"><div class="ico">🖍️</div><div class="nm">著色本</div><div class="ds">家人的照片變成線條畫，塗上喜歡的顏色</div></a>
  <a class="game" href="onet/"><div class="ico">🔗</div><div class="nm">全家連連看</div><div class="ds">把一樣的照片連起來，轉彎不超過兩次就消掉</div></a>
  <a class="game" href="span/"><div class="ico">🔦</div><div class="nm">記憶燈燈</div><div class="ds">記住格子亮起來的順序，再照順序點回去</div></a>
  <a class="game" href="shop/"><div class="ico">🛒</div><div class="nm">去買菜</div><div class="ds">記住購物清單，從輸送帶上挑對的東西</div></a>
  <a class="game" href="wire/"><div class="ico">💡</div><div class="nm">接電線</div><div class="ds">推動整排整列，把電池接到燈泡</div></a>
</div>
</body>
</html>
